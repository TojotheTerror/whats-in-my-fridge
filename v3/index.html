<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17151f">
<title>What's in my fridge?</title>
<style>
:root{--bg:#17151f;--card:#262333;--card2:#3a3648;--fg:#f6f2ff;--muted:#a59fbf;--dim:#7d7896;--nav:#211e2c;--accent:#ffb347;--accent2:#ff7a59;--ok:#5ee08f;--warn:#ff9b7a;--heart:#ff6b8b;--line:#2e2a3c;--shadow:0 10px 30px rgba(0,0,0,.5);--onc:#17151f}
html[data-theme=light]{--bg:#fff8f0;--card:#fff;--card2:#f1e8dd;--fg:#1d1a26;--muted:#5c5573;--dim:#8f88a6;--nav:#fff;--accent:#f08c00;--accent2:#e8590c;--ok:#2b9348;--warn:#c2410c;--heart:#e0245e;--line:#eadfd2;--shadow:0 8px 24px rgba(60,40,20,.15)}
@media (prefers-color-scheme:light){html:not([data-theme]){--bg:#fff8f0;--card:#fff;--card2:#f1e8dd;--fg:#1d1a26;--muted:#5c5573;--dim:#8f88a6;--nav:#fff;--accent:#f08c00;--accent2:#e8590c;--ok:#2b9348;--warn:#c2410c;--heart:#e0245e;--line:#eadfd2;--shadow:0 8px 24px rgba(60,40,20,.15)}}
*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0}
input{font:inherit;color:inherit}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.4}
.app{max-width:440px;margin:0 auto;min-height:100vh}
.top{padding:20px 18px 6px;display:flex;align-items:center;gap:12px}
.logo{font-size:28px;background:linear-gradient(135deg,var(--accent2),var(--accent));border-radius:14px;padding:5px 9px}
h1{font-size:26px;font-weight:800;letter-spacing:-.03em;flex:1;line-height:1.1}
.tag{display:block;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.theme{background:var(--card);border-radius:12px;padding:8px 10px;font-size:18px}
main{padding:6px 18px calc(130px + env(safe-area-inset-bottom))}
.screen{display:none}.screen.on{display:block}
.search{display:flex;gap:8px;margin:10px 0}
.search input{flex:1;min-width:0;padding:14px;border:0;border-radius:16px;background:var(--card);font-size:16px;outline:none}
.search input:focus{box-shadow:0 0 0 2px var(--accent)}
.go{background:var(--accent);color:var(--onc);border-radius:16px;padding:0 18px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{background:var(--card);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600}
.chip.unknown{outline:1px dashed var(--dim);color:var(--muted)}
.chip b{margin-left:6px;color:var(--dim)}
.row{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:12px -18px;padding:0 18px}
.row::-webkit-scrollbar{display:none}
.f{flex:none;background:var(--card);border-radius:12px;padding:9px 14px;font-size:14px;font-weight:600;color:var(--muted)}
.f.on{background:var(--fg);color:var(--bg)}
.sec{font-size:20px;font-weight:800;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.n{background:var(--accent);color:var(--onc);border-radius:8px;padding:1px 8px;font-size:14px}
.rc{display:flex;gap:12px;align-items:center;border-radius:20px;padding:12px;margin-bottom:10px;background:var(--card);width:100%;text-align:left}
.rc.ready{background:linear-gradient(135deg,color-mix(in srgb,var(--ok) 18%,var(--card)),var(--card))}
.ic{width:56px;height:56px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:30px}
.rb{flex:1;min-width:0}
.rb h3{font-size:17px;font-weight:700;line-height:1.2}
.meta{font-size:13px;color:var(--muted)}
.miss{font-size:13px;color:var(--warn);font-weight:600}
.bar{height:5px;border-radius:3px;background:var(--card2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#b5f55e)}
.heart{font-size:22px;color:var(--heart);padding:6px;flex:none}
.c-poultry{background:#ffb347;color:#17151f}.c-seafood{background:#4cc9f0;color:#17151f}.c-beef{background:#ff5d5d;color:#17151f}.c-pork{background:#ff8fc7;color:#17151f}.c-veg{background:#5ee08f;color:#17151f}
.empty{color:var(--muted);padding:18px 4px;font-size:15px}
details.staples{background:var(--card);border-radius:16px;padding:12px 14px;margin:10px 0}
details.staples summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none}details.staples summary::-webkit-details-marker{display:none}details.staples summary::after{content:' ▾';color:var(--accent)}details.staples[open] summary::after{content:' ▴'}
.stgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.stgrid label{font-size:13px;background:var(--card2);border-radius:10px;padding:6px 10px;cursor:pointer;display:flex;gap:6px;align-items:center}
.stgrid input{accent-color:var(--ok)}
/* build */
.mode{display:flex;gap:8px;margin:6px 0 14px}
.mo{flex:1;background:var(--card);border-radius:14px;padding:12px 8px;font-weight:700;font-size:14px;color:var(--muted)}
.mo.on{background:var(--card2);color:var(--fg);outline:2px solid var(--accent)}
.mo small{display:block;font-weight:600;font-size:11px;color:var(--dim)}
.steps{display:flex;gap:6px;margin-bottom:12px}
.st{flex:1;text-align:center;font-size:12px;padding:7px 0;background:var(--card);border-radius:10px;color:var(--muted);font-weight:700}
.st.on{background:var(--accent);color:var(--onc)}.st.done{color:var(--fg)}
.ask{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:4px 0 14px;line-height:1.15}
.cats{display:flex;flex-direction:column;gap:10px}
.cat{border-radius:22px;padding:16px 18px;text-align:left;display:flex;align-items:center;gap:14px;opacity:.6;transition:transform .15s,opacity .15s}
.cat.on{opacity:1;transform:scale(1.02);box-shadow:var(--shadow)}
.ce{font-size:36px}.cat b{font-size:21px;font-weight:800;display:block}.cat small{font-size:13px;font-weight:600;opacity:.75}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.opt{background:var(--card);border-radius:12px;padding:10px 14px;font-weight:600}
.opt.on{background:var(--fg);color:var(--bg)}
.cta{display:block;width:100%;margin-top:16px;padding:15px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#17151f;border-radius:18px;font-weight:800;font-size:17px}
.cta.ghost{background:var(--card);color:var(--accent)}
.cta:disabled{opacity:.4}
.note{background:var(--card);border-radius:16px;padding:14px;color:var(--muted);font-size:14px;margin:10px 0}
/* recipes grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:22px;padding:14px;display:flex;flex-direction:column;min-height:150px;text-align:left;position:relative}
.tile .te{font-size:42px;flex:1}.tile b{font-size:15px;font-weight:800;line-height:1.2}.tile small{font-weight:600;opacity:.75;font-size:12px}
.tile .th{position:absolute;top:8px;right:10px;font-size:18px;color:#17151f}
/* list */
.shop{background:var(--card);border-radius:20px;padding:0 14px}
.shop label{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-weight:600}
.shop label:last-child{border-bottom:0}
.shop input{accent-color:var(--ok);width:22px;height:22px;flex:none}
.shop .it{flex:1}.shop small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.shop .done .it{text-decoration:line-through;color:var(--dim)}
.btns{display:flex;gap:8px}.btns .cta{flex:1}
/* tabs */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:416px;display:flex;background:var(--nav);border-radius:24px;box-shadow:var(--shadow);z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:10px 0 12px;color:var(--dim);font-weight:700;position:relative}
.tab span{font-size:22px}.tab.on{color:var(--accent)}
.badge{position:absolute;top:6px;left:calc(50% + 8px);background:var(--heart);color:#fff;border-radius:999px;font-size:10px;min-width:16px;padding:0 4px;line-height:16px}
/* recipe sheet */
.sheet{position:fixed;inset:0;overflow:auto;background:var(--bg);transform:translateY(100%);transition:transform .25s ease;z-index:10}
.sheet.open{transform:none}
.sh{max-width:440px;margin:0 auto;padding:16px 18px 60px}
.shbar{display:flex;justify-content:space-between;align-items:center}
.back{color:var(--accent);font-weight:800;padding:6px 0;font-size:16px}
.hero{height:130px;display:grid;place-items:center;font-size:64px;margin:12px 0;border-radius:26px}
.sh h2{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.serv{display:flex;gap:8px;align-items:center;margin:14px 0;font-weight:600}
.serv button{min-width:44px;height:38px;background:var(--card);border-radius:12px;font-weight:700}
.serv button.on{background:var(--accent);color:var(--onc)}
h4{font-size:20px;font-weight:800;margin:20px 0 6px}
.ing{list-style:none}
.ing li{padding:11px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.ing .mk{width:20px;flex:none;color:var(--ok);font-weight:800}
.ing li.no .mk{color:var(--warn)}
.ing li.h .tx{color:var(--muted)}
.ing .opt2{font-size:12px;color:var(--dim)}
.need{background:color-mix(in srgb,var(--warn) 15%,var(--card));border-radius:16px;padding:12px 14px;margin:12px 0;font-size:14px}
.need .cta{margin-top:10px;padding:11px;font-size:15px}
.sp{padding-left:24px}.sp li{margin-bottom:12px}
.scaled{font-size:12px;color:var(--dim);margin-top:6px}
/* cook mode */
.cook{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column;padding:18px 18px calc(24px + env(safe-area-inset-bottom))}
.cook.open{display:flex}
.cook .cb{max-width:440px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column}
.cook .prog{display:flex;gap:4px;margin:14px 0}.cook .prog i{flex:1;height:6px;border-radius:3px;background:var(--card2)}.cook .prog i.on{background:var(--accent)}
.cook .stepn{color:var(--accent);font-weight:800;font-size:15px}
.cook .stept{font-size:27px;font-weight:700;line-height:1.35;flex:1;margin-top:10px;overflow:auto}
.cook .nav{display:flex;gap:10px}.cook .nav button{flex:1;padding:18px;border-radius:18px;font-size:18px;font-weight:800;background:var(--card)}
.cook .nav .nx{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#17151f}
.wake{font-size:12px;color:var(--dim);margin-top:8px;text-align:center}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
.foot{font-size:12px;color:var(--dim);margin:28px 0 0}
</style></head><body>
<div class="app">
 <header class="top"><span class="logo">🔥</span><h1>What can I make?<span class="tag" id="tagline">Cook with what you've got</span></h1><button class="theme" id="theme" aria-label="Switch light or dark">🌗</button></header>
