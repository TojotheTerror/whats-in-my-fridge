60°F on a thermometer. Rest 10 minutes before slicing."]},{"id":"mexican-rice","name":"Mexican rice","meal":["lunch","dinner"],"cuisine":"Mexican","minutes":35,"serves":4,"veg":true,"ingredients":[{"item":"rice","qty":1,"unit":"cup","note":"uncooked long-grain"},{"item":"onion","qty":0.5,"unit":"","note":"finely diced"},{"item":"garlic","qty":2,"unit":"clove","note":"minced"},{"item":"tomato paste","qty":2,"unit":"tbsp"},{"item":"cumin","qty":0.5,"unit":"tsp"},{"item":"chicken broth","qty":2,"unit":"cup","note":"use vegetable broth to keep it vegetarian"},{"item":"vegetable oil","qty":2,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""}],"steps":["Heat the oil in a medium saucepan over medium heat, add the rice and stir 4–5 minutes until lightly golden.","Add the onion and garlic and cook 2 minutes, then stir in the tomato paste and cumin until the rice is coated.","Pour in the broth and 1/2 tsp salt, bring to a boil, then cover tightly and cook on low for 18 minutes without lifting the lid.","Take off the heat, leave covered 5 minutes, then fluff with a fork."]},{"id":"migas","name":"Migas","meal":["breakfast","lunch"],"cuisine":"Tex-Mex","minutes":20,"serves":2,"veg":true,"ingredients":[{"item":"eggs","qty":4,"unit":""},{"item":"tortillas","qty":3,"unit":"","note":"corn, cut into 1-inch strips"},{"item":"onion","qty":0.25,"unit":"","note":"diced"},{"item":"jalapeno","qty":1,"unit":"","note":"seeded and minced"},{"item":"tomatoes","qty":1,"unit":"","note":"diced"},{"item":"cheese","qty":0.5,"unit":"cup","note":"shredded"},{"item":"salsa","qty":0.25,"unit":"cup","optional":true,"note":"for serving"},{"item":"vegetable oil","qty":2,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""}],"steps":["Whisk the eggs with a pinch of salt.","Heat the oil in a nonstick skillet over medium heat and fry the tortilla strips 3–4 minutes, stirring, until golden and crisp.","Add the onion and jalapeno and cook 2 minutes, then add the tomatoes and cook 1 minute more.","Pour in the eggs and stir gently 2–3 minutes until just set; sprinkle with the cheese, cover for 30 seconds to melt, and serve with salsa if you like."]},{"id":"minestrone","name":"Minestrone","meal":["lunch","dinner"],"cuisine":"Italian","minutes":45,"serves":6,"veg":true,"ingredients":[{"item":"onion","qty":1,"unit":"","note":"diced"},{"item":"carrots","qty":2,"unit":"","note":"diced"},{"item":"celery","qty":2,"unit":"piece","note":"stalks, diced"},{"item":"zucchini","qty":1,"unit":"","note":"diced"},{"item":"canned tomatoes","qty":1,"unit":"can","note":"14.5 oz, diced"},{"item":"chicken broth","qty":6,"unit":"cup","note":"use vegetable broth to keep it vegetarian"},{"item":"canned chickpeas","qty":1,"unit":"can","note":"drained (or any white beans)"},{"item":"pasta","qty":0.75,"unit":"cup","note":"small shapes"},{"item":"italian seasoning","qty":1,"unit":"tsp"},{"item":"olive oil","qty":2,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""}],"steps":["Heat the olive oil in a large pot over medium heat and cook the onion, carrots, and celery 8 minutes until softened.","Add the zucchini and italian seasoning and cook 2 minutes.","Add the diced tomatoes, vegetable broth, and chickpeas; bring to a boil, then simmer on low 15 minutes.","Stir in the pasta and simmer 10 minutes more until tender. Season with salt and serve, with parmesan on top if you like."]},{"id":"mushroom-risotto","name":"Mushroom risotto","meal":["dinner"],"cuisine":"Italian","minutes":40,"serves":4,"veg":true,"ingredients":[{"item":"rice","qty":1.5,"unit":"cup","note":"arborio is best; regular long-grain white rice works too, just a little less creamy"},{"item":"mushrooms","qty":8,"unit":"oz","note":"sliced"},{"item":"chicken broth","qty":5,"unit":"cup","note":"kept warm; use vegetable broth to keep it vegetarian"},{"item":"onion","qty":1,"unit":"","note":"finely diced"},{"item":"garlic","qty":2,"unit":"clove","note":"minced"},{"item":"butter","qty":2,"unit":"tbsp"},{"item":"olive oil","qty":2,"unit":"tbsp"},{"item":"parmesan","qty":0.5,"unit":"cup","note":"grated"},{"item":"salt","qty":null,"unit":""}],"steps":["Warm the vegetable broth in a small pot on low. Heat the olive oil in a wide pan over medium-high heat and cook the mushrooms 6–7 minutes until browned; move to a bowl.","Lower to medium, add 1 tbsp butter and the onion, and cook 4 minutes until soft; add the garlic for 30 seconds.","Add the rice (arborio, or regular white rice is fine) and stir 1 minute to coat. Add the warm broth one ladle at a time, stirring often and waiting until each is mostly absorbed, for 18–22 minutes, until the rice is tender with a slight bite.","Stir in the mushrooms, the remaining butter, and the parmesan; season with salt. It should be loose and creamy — add a splash more broth if it's stiff."]},{"id":"one-pot-chicken-and-rice","name":"One-pot chicken and rice","meal":["dinner"],"cuisine":"One-pot","minutes":45,"serves":4,"veg":false,"ingredients":[{"item":"chicken thighs","qty":1.5,"unit":"lb","note":"boneless, skinless"},{"item":"paprika","qty":1,"unit":"tsp"},{"item":"garlic powder","qty":1,"unit":"tsp"},{"item":"olive oil","qty":1,"unit":"tbsp"},{"item":"onion","qty":1,"unit":"","note":"diced"},{"item":"garlic","qty":2,"unit":"clove","note":"minced"},{"item":"rice","qty":1.5,"unit":"cup","note":"uncooked long-grain white"},{"item":"chicken broth","qty":3,"unit":"cup"},{"item":"frozen peas","qty":1,"unit":"cup"},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Season the chicken thighs with the paprika, garlic powder, salt and pepper.","Heat the oil in a large lidded pot over medium-high heat and brown the chicken 3 minutes per side; move to a plate (it will finish cooking later).","Lower to medium, add the onion and cook 4 minutes, then the garlic for 30 seconds. Stir in the rice for 1 minute.","Pour in the broth, scraping up the browned bits, and bring to a boil. Nestle the chicken on top, cover, and cook on low for 18–20 minutes until the rice is tender and the chicken reaches 165°F.","Scatter the peas over, cover again off the heat for 5 minutes, then fluff and serve."]},{"id":"overnight-oats","name":"Overnight oats","meal":["breakfast"],"cuisine":"Classic","minutes":5,"serves":1,"veg":true,"ingredients":[{"item":"oats","qty":0.5,"unit":"cup","note":"rolled"},{"item":"milk","qty":0.5,"unit":"cup"},{"item":"yogurt","qty":0.25,"unit":"cup"},{"item":"honey","qty":1,"unit":"tsp"},{"item":"berries","qty":0.25,"unit":"cup","optional":true}],"steps":["In a jar or container, stir together the oats, milk, yogurt and honey.","Cover and refrigerate overnight, or at least 4 hours, so the oats soften.","In the morning, stir, top with berries if using, and eat cold."]},{"id":"oyakodon","name":"Oyakodon (chicken and egg rice bowl)","meal":["lunch","dinner"],"cuisine":"Japanese","minutes":25,"serves":2,"veg":false,"ingredients":[{"item":"chicken thighs","qty":8,"unit":"oz","note":"boneless, skinless, cut into bite-size pieces"},{"item":"eggs","qty":3,"unit":""},{"item":"onion","qty":0.5,"unit":"","note":"thinly sliced"},{"item":"chicken broth","qty":0.5,"unit":"cup"},{"item":"soy sauce","qty":2,"unit":"tbsp"},{"item":"sugar","qty":1,"unit":"tbsp"},{"item":"green onions","qty":2,"unit":"","note":"sliced"},{"item":"rice","qty":2,"unit":"cup","note":"cooked, hot"}],"steps":["Combine the broth, soy sauce, and sugar in a medium skillet and bring to a simmer over medium heat.","Add the onion and simmer 3 minutes until soft.","Add the chicken in one layer, cover, and simmer 6–8 minutes, turning once, until it reaches 165°F inside.","Lightly beat the eggs and pour them over the chicken. Cover and cook on low 2–3 minutes until the eggs are set (no longer runny).","Divide the rice between bowls, slide the chicken and egg on top with some sauce, and sprinkle with green onions."]},{"id":"pasta-e-ceci","name":"Pasta e ceci (chickpea pasta soup)","meal":["lunch","dinner"],"cuisine":"Italian","minutes":35,"serves":4,"veg":true,"ingredients":[{"item":"canned chickpeas","qty":2,"unit":"can","note":"15 oz each, drained and rinsed"},{"item":"pasta","qty":1,"unit":"cup","note":"small shapes like ditalini or broken spaghetti"},{"item":"chicken broth","qty":4,"unit":"cup","note":"use vegetable broth to keep it vegetarian"},{"item":"onion","qty":1,"unit":"","note":"diced"},{"item":"garlic","qty":3,"unit":"clove","note":"minced"},{"item":"tomato paste","qty":2,"unit":"tbsp"},{"item":"olive oil","qty":2,"unit":"tbsp"},{"item":"parmesan","qty":0.25,"unit":"cup","note":"grated, for serving"},{"item":"red pepper flakes","qty":null,"unit":"","optional":true},{"item":"salt","qty":null,"unit":""}],"steps":["Heat the olive oil in a pot over medium heat and cook the onion 5 minutes until soft; add the garlic and a pinch of red pepper flakes for 1 minute.","Stir in the tomato paste for 1 minute, then add the chickpeas and vegetable broth and bring to a boil.","Scoop out about 1 cup of the chickpeas, mash them with a fork, and stir them back in to thicken the soup.","Add the pasta and simmer over medium-low 10–12 minutes, stirring often, until tender; add a splash of water if it gets too thick.","Season with salt and serve with parmesan and a drizzle of olive oil."]},{"id":"pasta-primavera","name":"Pasta primavera","meal":["lunch","dinner"],"cuisine":"Italian","minutes":30,"serves":4,"veg":true,"ingredients":[{"item":"pasta","qty":12,"unit":"oz","note":"penne or farfalle"},{"item":"zucchini","qty":1,"unit":"","note":"halved and sliced"},{"item":"bell pepper","qty":1,"unit":"","note":"sliced"},{"item":"broccoli","qty":2,"unit":"cup","note":"small florets"},{"item":"cherry tomatoes","qty":1,"unit":"cup","note":"halved"},{"item":"garlic","qty":2,"unit":"clove","note":"minced"},{"item":"olive oil","qty":3,"unit":"tbsp"},{"item":"parmesan","qty":0.5,"unit":"cup","note":"grated"},{"item":"lemon","qty":0.5,"unit":"","note":"juiced"},{"item":"salt","qty":null,"unit":""}],"steps":["Cook the pasta in salted boiling water; add the broccoli for the last 3 minutes. Save 1/2 cup pasta water, then drain together.","Meanwhile, heat the olive oil in a large pan over medium-high heat and cook the zucchini and bell pepper 5–6 minutes until tender-crisp.","Add the garlic and cherry tomatoes and cook 2 minutes until the tomatoes just soften.","Add the pasta and broccoli, the lemon juice, the parmesan, and a splash of pasta water; toss over low heat 1 minute, season with salt, and serve."]},{"id":"patty-melt","name":"Patty melt","meal":["lunch","dinner"],"cuisine":"American comfort","minutes":30,"serves":2,"veg":false,"ingredients":[{"item":"ground beef","qty":0.5,"unit":"lb"},{"item":"onion","qty":1,"unit":"","note":"thinly sliced"},{"item":"butter","qty":2,"unit":"tbsp"},{"item":"bread","qty":4,"unit":"slice","note":"rye if you have it"},{"item":"cheese","qty":4,"unit":"slice","note":"Swiss or American"},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Melt 1 tbsp butter in a skillet over medium heat and cook the onion 10 minutes, stirring, until soft and golden; set aside.","Shape the ground beef into 2 thin oval patties about the size of the bread and season with salt and pepper.","Cook the patties in the same skillet over medium-high heat 3–4 minutes per side until they reach 160°F.","Build each sandwich: bread, cheese slice, patty, onions, cheese slice, bread.","Wipe the pan, melt the remaining butter over medium-low heat and cook the sandwiches 2–3 minutes per side until the bread is golden and the cheese melts."]},{"id":"peanut-butter-banana-smoothie","name":"Peanut butter banana smoothie","meal":["breakfast","snack"],"cuisine":"Classic","minutes":5,"serves":1,"veg":true,"ingredients":[{"item":"bananas","qty":1,"unit":"","note":"ripe, frozen if possible"},{"item":"peanut butter","qty":2,"unit":"tbsp"},{"item":"milk","qty":1,"unit":"cup"},{"item":"yogurt","qty":0.25,"unit":"cup","optional":true},{"item":"honey","qty":1,"unit":"tsp","optional":true}],"steps":["Peel the banana and break it into chunks.","Add the banana, peanut butter, milk, yogurt and honey to a blender.","Blend on high for 30–60 seconds until smooth; add a splash more milk if it's too thick, or a few ice cubes if using a fresh banana."]},{"id":"peanut-butter-banana-toast","name":"Peanut butter banana toast","meal":["breakfast","snack"],"cuisine":"Classic","minutes":5,"serves":1,"veg":true,"ingredients":[{"item":"bread","qty":2,"unit":"slice"},{"item":"peanut butter","qty":2,"unit":"tbsp"},{"item":"bananas","qty":1,"unit":"","note":"sliced"},{"item":"honey","qty":1,"unit":"tsp","optional":true},{"item":"cinnamon","qty":1,"unit":"pinch","optional":true}],"steps":["Toast the bread until golden.","Spread the peanut butter over the warm toast.","Top with banana slices, then drizzle with honey and sprinkle with cinnamon if you like."]},{"id":"peanut-butter-energy-bites","name":"Peanut butter energy bites","meal":["snack","breakfast"],"cuisine":"Classic","minutes":40,"serves":6,"veg":true,"ingredients":[{"item":"oats","qty":1,"unit":"cup","note":"old-fashioned rolled"},{"item":"peanut butter","qty":0.5,"unit":"cup"},{"item":"honey","qty":0.33,"unit":"cup"},{"item":"vanilla","qty":0.5,"unit":"tsp"},{"item":"cinnamon","qty":0.25,"unit":"tsp","optional":true},{"item":"salt","qty":1,"unit":"pinch"}],"steps":["Stir the oats, peanut butter, honey, vanilla, cinnamon if using and salt together in a bowl until evenly combined.","Chill the mixture 20–30 minutes so it is easier to handle.","Roll into 1-inch balls (about 14) with damp hands. Store in a covered container in the fridge up to 1 week."]},{"id":"peanut-noodles","name":"Peanut noodles","meal":["lunch","dinner"],"cuisine":"Chinese","minutes":20,"serves":2,"veg":true,"ingredients":[{"item":"pasta","qty":8,"unit":"oz","note":"spaghetti or any long noodles"},{"item":"peanut butter","qty":3,"unit":"tbsp"},{"item":"soy sauce","qty":2,"unit":"tbsp"},{"item":"vinegar","qty":1,"unit":"tbsp"},{"item":"honey","qty":1,"unit":"tbsp"},{"item":"garlic","qty":1,"unit":"clove","note":"grated"},{"item":"sesame oil","qty":1,"unit":"tsp"},{"item":"cucumber","qty":0.5,"unit":"","note":"cut into thin sticks","optional":true},{"item":"green onions","qty":2,"unit":"","note":"sliced"}],"steps":["Cook the noodles in salted boiling water according to the package; save 1/2 cup of the cooking water, then drain.","While the pasta cooks, whisk the peanut butter, soy sauce, vinegar, honey, garlic, and sesame oil in a large bowl until smooth.","Add the hot noodles and toss, splashing in cooking water a little at a time until the sauce is creamy and coats everything.","Top with green onions and cucumber and serve warm or cold."]},{"id":"penne-tomato-sauce","name":"Penne with tomato sauce","meal":["lunch","dinner"],"cuisine":"Italian","minutes":30,"serves":4,"veg":true,"ingredients":[{"item":"pasta","qty":1,"unit":"lb","note":"penne"},{"item":"canned tomatoes","qty":1,"unit":"can","note":"28 oz, crushed"},{"item":"garlic","qty":3,"unit":"clove","note":"minced"},{"item":"olive oil","qty":3,"unit":"tbsp"},{"item":"italian seasoning","qty":1,"unit":"tsp"},{"item":"sugar","qty":1,"unit":"pinch","optional":true},{"item":"parmesan","qty":0.5,"unit":"cup","note":"grated, for serving"},{"item":"fresh herbs","qty":null,"unit":"","note":"basil","optional":true},{"item":"salt","qty":null,"unit":""}],"steps":["Heat the olive oil in a saucepan over medium heat, add the garlic, and cook 1 minute until fragrant.","Pour in the crushed tomatoes, add the italian seasoning, a pinch of sugar if the tomatoes taste sour, and 1/2 tsp salt; simmer on low for 15–20 minutes, stirring now and then.","Meanwhile, cook the penne in a large pot of salted boiling water according to the package; drain.","Toss the penne with the sauce and serve topped with parmesan and torn basil if you have it."]},{"id":"pico-de-gallo","name":"Pico de gallo","meal":["snack"],"cuisine":"Mexican","minutes":15,"serves":4,"veg":true,"ingredients":[{"item":"tomatoes","qty":4,"unit":"","note":"Roma, diced"},{"item":"onion","qty":0.5,"unit":"","note":"white, finely diced"},{"item":"jalapeno","qty":1,"unit":"","note":"seeded and minced"},{"item":"fresh herbs","qty":null,"unit":"","note":"a small handful of cilantro, chopped"},{"item":"lime","qty":1,"unit":""},{"item":"salt","qty":null,"unit":""}],"steps":["Put the diced tomatoes, onion and jalapeno in a bowl.","Add the cilantro, the juice of the lime and 1/2 tsp salt and stir well.","Let it sit 10 minutes so the flavors blend, then taste and add more salt or lime; serve with chips, tacos or eggs."]},{"id":"pita-pizzas","name":"Pita pizzas","meal":["lunch","dinner","snack"],"cuisine":"Italian","minutes":15,"serves":2,"veg":true,"ingredients":[{"item":"pita","qty":2,"unit":""},{"item":"pasta sauce","qty":0.5,"unit":"cup","note":"marinara"},{"item":"mozzarella","qty":1,"unit":"cup","note":"shredded"},{"item":"bell pepper","qty":0.5,"unit":"","note":"thinly sliced","optional":true},{"item":"mushrooms","qty":3,"unit":"","note":"thinly sliced","optional":true},{"item":"italian seasoning","qty":0.5,"unit":"tsp"},{"item":"olive oil","qty":1,"unit":"tsp"}],"steps":["Heat the oven to 425°F. Place the pitas on a baking sheet and brush lightly with olive oil.","Spread each pita with marinara, leaving a small border, then top with mozzarella, bell pepper, and mushrooms.","Sprinkle with italian seasoning and bake 8–10 minutes until the cheese is melted and the edges are crisp."]},{"id":"pork-chops-with-apples","name":"Pork chops with apples","meal":["dinner"],"cuisine":"American comfort","minutes":30,"serves":4,"veg":false,"ingredients":[{"item":"pork chops","qty":4,"unit":"","note":"boneless, about 1 inch thick"},{"item":"vegetable oil","qty":1,"unit":"tbsp"},{"item":"butter","qty":2,"unit":"tbsp"},{"item":"apples","qty":2,"unit":"","note":"cored and sliced"},{"item":"onion","qty":0.5,"unit":"","note":"thinly sliced"},{"item":"brown sugar","qty":1,"unit":"tbsp"},{"item":"cinnamon","qty":0.5,"unit":"tsp"},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Pat the pork chops dry and season both sides with salt and pepper.","Heat the oil in a large skillet over medium-high heat and cook the chops 4–5 minutes per side until golden and they reach 145°F. Move to a plate and rest 3 minutes.","Lower the heat to medium, add the butter, apples and onion and cook 5–6 minutes, stirring, until softened.","Stir in the brown sugar, cinnamon and 2 tbsp water and cook 1 minute until glossy. Spoon the apples over the pork chops to serve."]},{"id":"red-lentil-dal","name":"Red lentil dal","meal":["lunch","dinner"],"cuisine":"Indian-style","minutes":35,"serves":4,"veg":true,"ingredients":[{"item":"lentils","qty":1,"unit":"cup","note":"red, rinsed"},{"item":"onion","qty":1,"unit":"","note":"diced"},{"item":"garlic","qty":3,"unit":"clove","note":"minced"},{"item":"ginger","qty":1,"unit":"tbsp","note":"grated"},{"item":"curry powder","qty":2,"unit":"tsp"},{"item":"cumin","qty":1,"unit":"tsp"},{"item":"canned tomatoes","qty":0.5,"unit":"can","note":"diced","optional":true},{"item":"lemon","qty":0.5,"unit":""},{"item":"vegetable oil","qty":2,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""}],"steps":["Heat the oil in a pot over medium heat. Cook the onion 5 minutes until soft.","Add the garlic, ginger, curry powder, and cumin and stir 1 minute.","Add the lentils, 3 cups water, and the tomatoes if using. Bring to a boil, then reduce to a simmer.","Simmer uncovered 20 minutes, stirring often, until the lentils break down into a thick soup; add a splash of water if it gets too thick.","Season with salt and a squeeze of lemon. Serve with rice or naan."]},{"id":"roasted-vegetables","name":"Roasted vegetables","meal":["lunch","dinner"],"cuisine":"Sheet-pan","minutes":40,"serves":4,"veg":true,"ingredients":[{"item":"broccoli","qty":3,"unit":"cup","note":"florets"},{"item":"carrots","qty":3,"unit":"","note":"cut in 1/2-inch coins"},{"item":"bell pepper","qty":1,"unit":"","note":"cut in chunks"},{"item":"red onion","qty":1,"unit":"","note":"cut in wedges"},{"item":"olive oil","qty":3,"unit":"tbsp"},{"item":"italian seasoning","qty":1,"unit":"tsp"},{"item":"garlic powder","qty":1,"unit":"tsp"},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Heat the oven to 425°F.","Toss the broccoli, carrots, bell pepper and red onion with the oil, italian seasoning, garlic powder, salt and pepper on a large sheet pan.","Spread in a single layer (use two pans if crowded so they roast instead of steam).","Roast 25–30 minutes, stirring halfway, until tender and browned at the edges."]},{"id":"salsa-chicken","name":"Salsa chicken","meal":["dinner"],"cuisine":"Tex-Mex","minutes":35,"serves":4,"veg":false,"ingredients":[{"item":"chicken breast","qty":1.5,"unit":"lb","note":"about 3 breasts"},{"item":"chili powder","qty":1,"unit":"tsp"},{"item":"cumin","qty":1,"unit":"tsp"},{"item":"salsa","qty":1.5,"unit":"cup"},{"item":"cheese","qty":1,"unit":"cup","note":"shredded"},{"item":"rice","qty":3,"unit":"cup","note":"cooked, for serving","optional":true},{"item":"salt","qty":null,"unit":""}],"steps":["Heat the oven to 400°F. Season the chicken on both sides with the chili powder, cumin and 1/2 tsp salt and lay it in a baking dish.","Pour the salsa over the chicken so it is covered.","Bake 20–25 minutes until the chicken reaches 165°F in the thickest part.","Sprinkle with the cheese and bake 3–5 minutes more until melted; serve over rice if you like."]},{"id":"sausage-and-egg-skillet","name":"Sausage and egg skillet","meal":["breakfast","dinner"],"cuisine":"American comfort","minutes":30,"serves":2,"veg":false,"ingredients":[{"item":"sausage","qty":8,"unit":"oz","note":"casings removed if links"},{"item":"potatoes","qty":2,"unit":"","note":"medium, diced small"},{"item":"bell pepper","qty":1,"unit":"","note":"diced"},{"item":"eggs","qty":4,"unit":""},{"item":"cheese","qty":0.5,"unit":"cup","note":"shredded"},{"item":"vegetable oil","qty":1,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""}],"steps":["Cook the sausage in a large skillet over medium-high heat for 7–8 minutes, breaking it up, until browned with no pink left and it reaches 160°F. Move to a plate.","Add the oil and potatoes with a pinch of salt; cover and cook on medium 10–12 minutes, stirring occasionally, until tender and golden.","Add the bell pepper and cook 3 minutes, then return the sausage to the pan.","Make 4 wells, crack in the eggs, cover and cook on medium-low 5–6 minutes until the whites are set. Sprinkle with cheese, cover for 1 minute to melt, and serve."]},{"id":"sausage-and-peppers","name":"Sausage and peppers","meal":["dinner"],"cuisine":"Italian","minutes":35,"serves":4,"veg":false,"ingredients":[{"item":"sausage","qty":1,"unit":"lb","note":"Italian sausage links"},{"item":"bell pepper","qty":3,"unit":"","note":"mixed colors, sliced into strips"},{"item":"onion","qty":1,"unit":"","note":"sliced"},{"item":"garlic","qty":2,"unit":"clove","note":"minced"},{"item":"italian seasoning","qty":1,"unit":"tsp"},{"item":"olive oil","qty":1,"unit":"tbsp"},{"item":"bread","qty":4,"unit":"piece","note":"hoagie rolls, for serving","optional":true},{"item":"salt","qty":null,"unit":""}],"steps":["Heat the olive oil in a large skillet over medium heat and brown the sausage links 8–10 minutes, turning, then move to a plate and slice into thick coins.","In the same pan, cook the bell pepper strips and onion with a pinch of salt for 8–10 minutes, stirring, until soft and lightly browned.","Add the garlic and italian seasoning and cook 1 minute.","Return the sausage, cover, and cook on medium-low 5–6 minutes until the sausage reaches 160°F inside. Serve as is or piled into the rolls (bread)."]},{"id":"scrambled-eggs-on-toast","name":"Scrambled eggs on toast","meal":["breakfast"],"cuisine":"Classic","minutes":10,"serves":1,"veg":true,"ingredients":[{"item":"eggs","qty":2,"unit":""},{"item":"milk","qty":1,"unit":"tbsp"},{"item":"butter","qty":1,"unit":"tbsp"},{"item":"bread","qty":2,"unit":"slice"},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Whisk the eggs with the milk and a pinch of salt and pepper until smooth.","Toast the bread and keep it warm on a plate.","Melt the butter in a nonstick pan over medium-low heat, then pour in the eggs.","Stir slowly with a spatula for 2–3 minutes until the eggs are softly set with no runny liquid left, then spoon onto the toast."]},{"id":"shakshuka","name":"Shakshuka","meal":["breakfast","lunch","dinner"],"cuisine":"Mediterranean","minutes":30,"serves":2,"veg":true,"ingredients":[{"item":"canned tomatoes","qty":1,"unit":"can","note":"14 oz, crushed or diced"},{"item":"eggs","qty":4,"unit":""},{"item":"onion","qty":1,"unit":"","note":"diced"},{"item":"bell pepper","qty":1,"unit":"","note":"diced"},{"item":"garlic","qty":2,"unit":"clove","note":"minced"},{"item":"cumin","qty":1,"unit":"tsp"},{"item":"paprika","qty":1,"unit":"tsp"},{"item":"olive oil","qty":2,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""},{"item":"bread","qty":4,"unit":"slice","note":"for dipping","optional":true}],"steps":["Heat the oil in a large skillet over medium heat. Add the onion and bell pepper and cook 6–8 minutes until soft.","Stir in the garlic, cumin and paprika and cook 1 minute until fragrant.","Add the tomatoes with a pinch of salt and simmer 8–10 minutes until slightly thickened.","Make 4 small wells in the sauce and crack an egg into each. Cover and cook on medium-low 6–8 minutes until the whites are fully set.","Serve straight from the pan with bread for dipping."]},{"id":"sheet-pan-chicken-and-vegetables","name":"Sheet-pan chicken and vegetables","meal":["dinner"],"cuisine":"Sheet-pan","minutes":45,"serves":4,"veg":false,"ingredients":[{"item":"chicken breast","qty":1.5,"unit":"lb","note":"cut in 1-inch pieces"},{"item":"potatoes","qty":1,"unit":"lb","note":"cut in 3/4-inch cubes"},{"item":"broccoli","qty":3,"unit":"cup","note":"florets"},{"item":"bell pepper","qty":1,"unit":"","note":"cut in chunks"},{"item":"olive oil","qty":3,"unit":"tbsp"},{"item":"italian seasoning","qty":2,"unit":"tsp"},{"item":"garlic powder","qty":1,"unit":"tsp"},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Heat the oven to 425°F and line a large sheet pan with foil or parchment.","Toss the potatoes with 1 tbsp oil and a pinch of salt, spread on the pan and roast 15 minutes.","Meanwhile, toss the chicken, broccoli and bell pepper with the remaining oil, italian seasoning, garlic powder, salt and pepper.","Add them to the pan in a single layer (use two pans if crowded) and roast 15–20 minutes more until the potatoes are golden and the chicken reaches 165°F."]},{"id":"sheet-pan-salmon-and-green-beans","name":"Sheet-pan salmon and green beans","meal":["dinner"],"cuisine":"Sheet-pan","minutes":25,"serves":4,"veg":false,"ingredients":[{"item":"salmon","qty":4,"unit":"piece","note":"6 oz fillets"},{"item":"green beans","qty":1,"unit":"lb","note":"trimmed"},{"item":"olive oil","qty":2,"unit":"tbsp"},{"item":"garlic","qty":2,"unit":"clove","note":"minced"},{"item":"lemon","qty":1,"unit":"","note":"half sliced, half for squeezing"},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Heat the oven to 400°F and line a sheet pan.","Toss the green beans with 1 tbsp oil, the garlic, salt and pepper, spread on the pan and roast 5 minutes.","Push the beans to the sides, place the salmon in the middle, brush with the remaining oil, season, and top with lemon slices.","Roast 12–15 minutes until the salmon is opaque and flakes easily with a fork (145°F). Squeeze the remaining lemon over and serve."]},{"id":"sheet-pan-sausage-and-potatoes","name":"Sheet-pan sausage and potatoes","meal":["dinner"],"cuisine":"Sheet-pan","minutes":50,"serves":4,"veg":false,"ingredients":[{"item":"sausage","qty":1,"unit":"lb","note":"links, cut in 1-inch pieces"},{"item":"potatoes","qty":1.5,"unit":"lb","note":"cut in 3/4-inch cubes"},{"item":"bell pepper","qty":1,"unit":"","note":"cut in chunks"},{"item":"onion","qty":1,"unit":"","note":"cut in wedges"},{"item":"olive oil","qty":2,"unit":"tbsp"},{"item":"paprika","qty":1,"unit":"tsp"},{"item":"garlic powder","qty":1,"unit":"tsp"},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Heat the oven to 425°F and line a large sheet pan.","Toss the potatoes with the oil, paprika, garlic powder, salt and pepper; spread out and roast 20 minutes.","Add the sausage, bell pepper and onion to the pan, toss with the potatoes, and spread back into one layer.","Roast 20–25 minutes more, stirring once, until the potatoes are golden and crisp at the edges and the sausage reaches 160°F (fully cooked smoked sausage just needs to be hot)."]},{"id":"shrimp-and-vegetable-stir-fry","name":"Shrimp and vegetable stir-fry","meal":["dinner"],"cuisine":"Chinese","minutes":20,"serves":2,"veg":false,"ingredients":[{"item":"shrimp","qty":12,"unit":"oz","note":"peeled and deveined"},{"item":"broccoli","qty":2,"unit":"cup","note":"small florets"},{"item":"bell pepper","qty":1,"unit":"","note":"sliced"},{"item":"garlic","qty":2,"unit":"clove","note":"minced"},{"item":"ginger","qty":1,"unit":"tsp","note":"grated"},{"item":"soy sauce","qty":2,"unit":"tbsp"},{"item":"cornstarch","qty":1,"unit":"tsp"},{"item":"vegetable oil","qty":2,"unit":"tbsp"}],"steps":["Mix the soy sauce, cornstarch, and 3 tbsp water in a small bowl.","Heat 1 tbsp oil in a large pan over high heat. Cook the shrimp 1–2 minutes per side until pink and opaque; move to a plate.","Add the remaining oil, the broccoli, and the bell pepper and stir-fry 3–4 minutes until crisp-tender.","Add the garlic and ginger for 30 seconds, return the shrimp, pour in the sauce, and stir 1 minute until glossy. Serve with rice."]},{"id":"shrimp-tacos","name":"Shrimp tacos","meal":["lunch","dinner"],"cuisine":"Mexican","minutes":25,"serves":3,"veg":false,"ingredients":[{"item":"shrimp","qty":1,"unit":"lb","note":"peeled and deveined, thawed if frozen"},{"item":"chili powder","qty":1,"unit":"tsp"},{"item":"garlic powder","qty":0.5,"unit":"tsp"},{"item":"cabbage","qty":2,"unit":"cup","note":"thinly shredded"},{"item":"lime","qty":2,"unit":""},{"item":"sour cream","qty":0.33,"unit":"cup"},{"item":"tortillas","qty":6,"unit":"","note":"small corn or flour"},{"item":"fresh herbs","qty":null,"unit":"","note":"cilantro, chopped"},{"item":"vegetable oil","qty":1,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""}],"steps":["Toss the cabbage with the juice of 1 lime and a pinch of salt; set aside.","Pat the shrimp dry and toss with the chili powder, garlic powder and 1/2 tsp salt.","Heat the oil in a large skillet over medium-high heat and cook the shrimp 1–2 minutes per side until pink and opaque all the way through.","Warm the tortillas in a dry pan, then fill with cabbage and shrimp, add a spoonful of sour cream, sprinkle with cilantro and serve with the second lime in wedges."]},{"id":"sloppy-joes","name":"Sloppy joes","meal":["lunch","dinner"],"cuisine":"American comfort","minutes":25,"serves":4,"veg":false,"ingredients":[{"item":"ground beef","qty":1,"unit":"lb"},{"item":"onion","qty":1,"unit":"","note":"diced"},{"item":"bell pepper","qty":1,"unit":"","note":"diced"},{"item":"ketchup","qty":0.75,"unit":"cup"},{"item":"brown sugar","qty":1,"unit":"tbsp"},{"item":"mustard","qty":1,"unit":"tsp"},{"item":"bread","qty":8,"unit":"slice","note":"toasted, or use buns"},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Cook the ground beef, onion and bell pepper in a large skillet over medium-high heat for 7–8 minutes, breaking up the meat, until no pink remains and the beef reaches 160°F.","Spoon off any excess fat.","Stir in the ketchup, brown sugar, mustard and 1/4 cup water; simmer ":""}],"steps":["Heat the olive oil in a large pot over medium heat; add the onion and carrot and cook 6–8 minutes until soft. Add the garlic for 1 minute.","Turn the heat to medium-high, add the ground beef, and cook 6–8 minutes, breaking it up, until browned with no pink left and it reaches 160°F.","Stir in the tomato paste for 1 minute, then add the crushed tomatoes and 1 tsp salt. Simmer uncovered on low for 25–30 minutes, stirring occasionally, until thick.","Near the end, cook the spaghetti in salted boiling water according to the package; drain.","Toss the spaghetti with the sauce and serve with parmesan."]},{"id":"spicy-cabbage-stir-fry","name":"Spicy cabbage stir-fry","meal":["lunch","dinner"],"cuisine":"Chinese","minutes":15,"serves":2,"veg":true,"ingredients":[{"item":"cabbage","qty":0.5,"unit":"","note":"small head, cut into bite-size pieces"},{"item":"garlic","qty":3,"unit":"clove","note":"sliced"},{"item":"red pepper flakes","qty":0.5,"unit":"tsp"},{"item":"soy sauce","qty":1,"unit":"tbsp"},{"item":"vinegar","qty":1,"unit":"tbsp"},{"item":"sugar","qty":1,"unit":"tsp"},{"item":"vegetable oil","qty":2,"unit":"tbsp"}],"steps":["Mix the soy sauce, vinegar, and sugar in a small bowl.","Heat the oil in a large pan over medium heat. Add the garlic and red pepper flakes and stir 30 seconds until fragrant, not brown.","Turn the heat to high, add the cabbage, and stir-fry 4–5 minutes until wilted but still a little crisp.","Pour in the sauce, toss 30 seconds, and serve with rice."]},{"id":"spicy-garlic-tofu","name":"Spicy garlic tofu","meal":["lunch","dinner"],"cuisine":"Chinese","minutes":25,"serves":2,"veg":true,"ingredients":[{"item":"tofu","qty":14,"unit":"oz","note":"extra-firm, patted dry and cubed"},{"item":"cornstarch","qty":2,"unit":"tbsp"},{"item":"garlic","qty":4,"unit":"clove","note":"minced"},{"item":"soy sauce","qty":2,"unit":"tbsp"},{"item":"honey","qty":1,"unit":"tbsp"},{"item":"hot sauce","qty":1,"unit":"tbsp","note":"sriracha works well"},{"ite "item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Whisk the eggs with a pinch of salt and pepper.","Heat the oil in a nonstick pan over medium heat. Add the garlic and cook 30 seconds, then add the spinach and stir 1–2 minutes until wilted.","Lower the heat to medium-low, pour in the eggs and stir gently for 2–3 minutes until softly set with no runny liquid.","Sprinkle with parmesan if using and serve."]},{"id":"steak-tacos","name":"Steak tacos","meal":["dinner"],"cuisine":"Mexican","minutes":30,"serves":4,"veg":false,"ingredients":[{"item":"steak","qty":1,"unit":"lb","note":"flank or sirloin"},{"item":"chili powder","qty":1,"unit":"tsp"},{"item":"garlic powder","qty":0.5,"unit":"tsp"},{"item":"lime","qty":2,"unit":""},{"item":"tortillas","qty":8,"unit":"","note":"small corn"},{"item":"onion","qty":0.5,"unit":"","note":"white, finely diced"},{"item":"fresh herbs","qty":null,"unit":"","note":"cilantro, chopped"},{"item":"vegetable oil","qty":1,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""}],"steps":["Pat the steak dry and rub with the chili powder, garlic powder, 1 tsp salt and the juice of 1 lime.","Heat the oil in a heavy skillet over high heat until shimmering and sear the steak 4–5 minutes per side until well browned and it reaches 135°F for medium (145°F for well done).","Rest the steak 5 minutes, then slice thinly across the grain and chop into small pieces.","Warm the tortillas in a dry pan, fill with steak, and top with onion, cilantro and a squeeze of the second lime."]},{"id":"stovetop-mac-and-cheese","name":"Stovetop mac and cheese","meal":["lunch","dinner"],"cuisine":"American comfort","minutes":25,"serves":4,"veg":true,"ingredients":[{"item":"pasta","qty":8,"unit":"oz","note":"elbow macaroni"},{"item":"butter","qty":2,"unit":"tbsp"},{"item":"flour","qty":2,"unit":"tbsp"},{"item":"milk","qty":2,"unit":"cup"},{"item":"cheese","qty":2,"unit":"cup","note":"shredded cheddar"},{"item":"mustard","qty":0.5,"unit":"t lic","qty":2,"unit":"clove","note":"minced"},{"item":"canned tomatoes","qty":1,"unit":"can","note":"14.5 oz diced"},{"item":"rice","qty":1,"unit":"cup","note":"cooked"},{"item":"italian seasoning","qty":1,"unit":"tsp"},{"item":"cheese","qty":1,"unit":"cup","note":"shredded"},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Heat the oven to 375°F. Stand the bell peppers upright in a baking dish (trim the bottoms slightly if they wobble).","Cook the ground beef and onion in a skillet over medium-high heat 7–8 minutes, breaking it up, until no pink remains and it reaches 160°F; add the garlic for 30 seconds and spoon off excess fat.","Stir in the canned tomatoes, rice, italian seasoning, salt and pepper, and half the cheese.","Pack the filling into the peppers, add 1/4 cup water to the dish, cover with foil and bake 30 minutes.","Uncover, top with the remaining cheese and bake 10 minutes more until the peppers are tender and the cheese is melted."]},{"id":"sweet-and-sour-chicken","name":"Sweet and sour chicken","meal":["dinner"],"cuisine":"Chinese","minutes":30,"serves":3,"veg":false,"ingredients":[{"item":"chicken breast","qty":1,"unit":"lb","note":"cut into 1-inch pieces"},{"item":"cornstarch","qty":3,"unit":"tbsp"},{"item":"bell pepper","qty":1,"unit":"","note":"cut into squares"},{"item":"onion","qty":0.5,"unit":"","note":"cut into chunks"},{"item":"ketchup","qty":0.25,"unit":"cup"},{"item":"vinegar","qty":3,"unit":"tbsp"},{"item":"sugar","qty":3,"unit":"tbsp"},{"item":"soy sauce","qty":1,"unit":"tbsp"},{"item":"vegetable oil","qty":3,"unit":"tbsp"}],"steps":["Stir the ketchup, vinegar, sugar, soy sauce, 1 tsp of the cornstarch, and 1/4 cup water together for the sauce.","Toss the chicken in the remaining cornstarch with a pinch of salt.","Heat 2 tbsp oil in a large pan over medium-high heat. Fry the chicken 6–8 minutes, turning, until golden and it reaches 165°F inside; move to a plate.","Add the remaining oil, the onion <script>

const EMO = [[/taco|tostada|nacho/, "🌮"], [/burrito|quesadilla|wrap|fajita/, "🌯"], [/pizza/, "🍕"], [/pasta|spaghetti|penne|ziti|mac|lo mein|noodle|cacio|bolognese|ramen/, "🍝"], [/soup|stew|chili|minestrone/, "🍲"], [/curry|dal|masala|korma|aloo|butter chicken|tandoori/, "🍛"], [/salad|raita/, "🥗"], [/pancake/, "🥞"], [/french toast|toast|sandwich|blt|melt|joe|grilled cheese/, "🥪"], [/smoothie/, "🥤"], [/oat|parfait|yogurt/, "🥣"], [/banana bread|bites/, "🍌"], [/omelette|egg|frittata|scramble|shakshuka|huevos|migas/, "🍳"], [/rice|bowl|risotto|oyakodon/, "🍚"], [/potato|hash/, "🥔"], [/salmon|fish/, "🐟"], [/shrimp/, "🍤"], [/steak|beef/, "🥩"], [/guacamole|hummus|salsa|pico|bruschetta/, "🥑"]];

  if (w.endsWith("es") && ALIAS[w.slice(0, -2)]) return ALIAS[w.slice(0, -2)];

  for (const [k, v] of Object.entries(props)) {

function fridgeResults() {

    .map(r => score(r, have))
    .filter(s => s.fromFridge > 0 && s.core.length <= 2 && !s.miss.some(i => PROTEIN.has(VOCAB[i].group)))
    .sort((a, b) => (a.core.length > 0) - (b.core.length > 0) || b.fromFridge - a.fromFridge || a.core.length - b.core.length || a.miss.length - b.miss.length || b.frac - a.frac || a.r.minutes - b.r.minutes);

const isFav = id => st.favs.includes(id);

// ---- FRIDGE tab ----

  if (st.fridge.length) chips.append(el("button", { class: "chip", style: "color:var(--muted)", onclick: () => { st.fridge = []; save(); renderAll(); } }, "Clear all"));

function renderStaples() {

function addFridge(text) { for (const p of text.split(/[,\n;]+/)) { const k = canon(p); if (k && !st.fridge.includes(k)) st.fridge.push(k); } fshown = 20; save(); renderAll(); }

// ---- BUILD tab ----

    el("button", { class: "mo" + (b.mode === "match" ? " on" : ""), onclick: () => { b.mode = "match"; renderBuild(); } }, "🔎 Matching recipes", el("small", { text: `from ${RECIPES.length} recipes` })));

    out.append(opts, el("button", { class: "cta", onclick: () => { b.step = 2; renderBuild(); scrollTo(0, 0); } }, b.veg.length ? "Show recipes →" : "Skip — show recipes →"));
  } else {

function buildMatches() {

// ---- RECIPES tab ----

    f.append(el("button", { class: "f" + (st.rf === k ? " on" : ""), onclick: () => { st.rf = k; rshown = 30; save(); renderRecipes(); } }, k));

  for (const r of list.slice(0, rshown)) out.append(el("button", { class: `tile c-${r._cat}`, "data-id": r.id, onclick: () => openRecipe(r.id) }, isFav(r.id) ? el("span", { class: "th", text: "♥" }) : null, el("span", { class: "te", text: r._e }), el("b", { text: r.name }), el("small", { text: `${r.minutes} min · ${r.cuisine}` })));

// ---- LIST tab ----

}
function renderList() {
  const out = $("lout"); out.replaceChildren();
  out.append(el("h2", { class: "sec" }, "Shopping list", el("span", { class: "n", text: st.list.filter(x => !x.done).length })));
  if (!st.list.length) { out.append(el("p", { class: "empty", text: "Your list is empty. Open a recipe and tap “Add to list” for anything you're missing." })); return; }

    el("button", { class: "cta ghost", onclick: () => { const n = st.list.filter(x => x.done).length; st.list = st.list.filter(x => !x.done); save(); renderAll(); toast(n ? `Cleared ${n}` : "Nothing checked"); } }, "Clear checked")));

async function copy(text) {

}

// ---- amounts ----
const FR = [[0.125, "⅛"], [0.25, "¼"], [1 / 3, "⅓"], [0.5, "½"], [2 / 3, "⅔"], [0.75, "¾"]];
function fmtQty(q) {
  if (q >= 10) return String(Math.round(q));
  const whole = Math.floor(q), rest = q - whole; let best = null, bd = 0.06;
  for (const [v, s] of FR) { const d = Math.abs(rest - v); if (d < bd) { bd = d; best = s; } }
  if (rest < 0.06) return String(whole || "a little"); if (rest > 0.94) return String(whole + 1);
  if (best) return (whole ? whole + " " : "") + best; return String(Math.round(q * 10) / 10);
}
const PLURAL = { cup: "cups", clove: "cloves", can: "cans", slice: "slices", piece: "pieces", package: "packages", handful: "handfuls", bunch: "bunches", pinch: "pinches" };

// ---- recipe sheet ----
let cur = null, servings = null;
function openRecipe(id, push = true) {

  if (push) history.pushState({ r: id }, "", "#" + id);
  drawRecipe(); $("sheet").classList.add("open"); $("sheet").scrollTop = 0; document.body.style.overflow = "hidden";
}
function closeRecipe(pop = true) { $("sheet").classList.remove("open"); document.body.style.overflow = ""; cur = null; if (pop && location.hash) history.back(); }
function drawRecipe() {
  const r = cur, have = owned(), f = servings / r.serves, s = score(r, have), sh = $("sh"); sh.replaceChildren();
  sh.append(el("div", { class: "shbar" }, el("button", { class: "back", onclick: () => closeRecipe() }, "← Back"),
    el("button", { class: "heart", "aria-label": "Save", text: isFav(r.id) ? "♥" : "♡", onclick: () => { toggleFav(r.id); drawRecipe(); } })));
  sh.append(el("div", { class: "hero c-" + r._cat, text: r._e }), el("h2", { text: r.name }),
    el("div", { class: "meta", text: `${r.minutes} min · ${r.cuisine} · ${r.meal.join(", ")}${r.veg ? " · vegetarian" : ""}` }));

  sh.append(sv);

    sh.append(el("div", { class: "need" }, el("div", { text: "🛒 You need: " + items.map(x => x.amt ? `${x.item} (${x.amt})` : x.item).join(", ") }),
      el("button", { class: "cta", onclick: () => addToList(items, r.name) }, "Add to shopping list")));
  }

    ul.append(el("li", { class: h ? "h" : "no" }, el("span", { class: "mk", text: h ? "✓" : "○" }),
      el("span", { class: "tx" }, (a ? a + " " : "") + ing.item + (ing.note ? `, ${ing.note}` : "") + (ing.qty == null && !ing.optional ? ", to taste" : ""), ing.optional ? el("span", { class: "opt2", text: " (optional)" }) : null)));
  }
  sh.append(ul);

}

// ---- cook mode ----
let cookIdx = 0, wake = null;
async function keepAwake() { try { if ("wakeLock" in navigator) { wake = await navigator.wakeLock.request("screen"); } } catch (e) { wake = null; } drawCook(); }
function openCook(i) { cookIdx = i; $("cook").classList.add("open"); keepAwake(); drawCook(); }
function closeCook() { $("cook").classList.remove("open"); try { wake && wake.release(); } catch (e) {} wake = null; }
function drawCook() {
  if (!cur || !$("cook").classList.contains("open")) return;
  const r = cur, n = r.steps.length, cb = $("cb"); cb.replaceChildren();
  cb.append(el("div", { class: "shbar" }, el("button", { class: "back", onclick: closeCook }, "✕ Exit"), el("b", { text: r.name })),
    el("div", { class: "prog" }, r.steps.map((_, i) => el("i", { class: i <= cookIdx ? "on" : "" }))),
    el("div", { class: "stepn", text: `Step ${cookIdx + 1} of ${n}` }),
    el("div", { class: "stept", text: r.steps[cookIdx] }),
    el("div", { class: "nav" },
      el("button", { disabled: cookIdx === 0 ? "" : null, onclick: () => { if (cookIdx > 0) { cookIdx--; drawCook(); } } }, "← Back"),
      el("button", { class: "nx", onclick: () => { if (cookIdx < n - 1) { cookIdx++; drawCook(); haptic(); } else { closeCook(); toast("Enjoy! 🍽️"); } } }, cookIdx < n - 1 ? "Next →" : "Done ✓")),
    el("div", { class: "wake", text: wake ? "Screen will stay on while cooking" : "Tip: your screen may dim while cooking" }));

// ---- tabs ----

applyTheme(); renderStaples(); renderAll(); save();
const startId = location.hash.slice(1); if (BYID[startId]) openRecipe(startId, false);

window.__fridge = { add: addFridge, results: () => fridgeResults().map(s => ({ id: s.r.id, miss: s.miss })), state: () => JSON.parse(JSON.stringify(st)),
  reset: () => { ls.del(KEY); st = fresh(); b = { mode: "match", step: 0, cat: "poultry", item: "chicken breast", veg: [] }; applyTheme(); renderStaples(); renderAll(); },
  build: () => buildMatches().map(s => ({ id: s.r.id, vhit: s.vhit })), count: RECIPES.length, canon };
