um, cut into 3/4-inch cubes"},{"item":"cauliflower","qty":1,"unit":"","note":"small head, cut into florets"},{"item":"onion","qty":1,"unit":"","note":"diced"},{"item":"garlic","qty":2,"unit":"clove","note":"minced"},{"item":"ginger","qty":1,"unit":"tsp","note":"grated"},{"item":"cumin","qty":1,"unit":"tsp"},{"item":"curry powder","qty":2,"unit":"tsp"},{"item":"tomatoes","qty":1,"unit":"","note":"chopped"},{"item":"vegetable oil","qty":3,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""}],"steps":["Heat the oil in a large pan with a lid over medium heat. Add the cumin and onion and cook 5 minutes until soft.","Add the garlic, ginger, and curry powder and stir 1 minute.","Add the potatoes, cauliflower, tomato, 1 tsp salt, and 1/4 cup water; stir to coat.","Cover and cook on medium-low 20–25 minutes, stirring every 5 minutes, until the potatoes are fork-tender; add a splash of water if it sticks.","Uncover and cook 2–3 minutes more to dry slightly. Serve with rice or naan."]},{"id":"apple-cinnamon-oatmeal","name":"Apple cinnamon oatmeal","meal":["breakfast"],"cuisine":"Classic","minutes":15,"serves":2,"veg":true,"ingredients":[{"item":"oats","qty":1,"unit":"cup","note":"rolled"},{"item":"milk","qty":2,"unit":"cup"},{"item":"apples","qty":1,"unit":"","note":"diced"},{"item":"cinnamon","qty":0.5,"unit":"tsp"},{"item":"brown sugar","qty":1,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""}],"steps":["Add the milk, diced apple, cinnamon and a pinch of salt to a saucepan and bring to a gentle simmer over medium heat.","Stir in the oats and lower the heat to medium-low.","Cook 5–7 minutes, stirring often, until the oats are creamy and the apple is soft.","Spoon into bowls and sprinkle with the brown sugar."]},{"id":"avocado-toast-with-egg","name":"Avocado toast with egg","meal":["breakfast","lunch"],"cuisine":"Classic","minutes":10,"serves":1,"veg":true,"ingredients":[{"item":"bread","qty":1,"unit":"slice"},{"item":"avocado","qty":0.5,"unit":""},{"item":"eggs","qty":1,"unit":""},{"item":"lemon","qty":0.25,"unit":"","note":"juiced","optional":true},{"item":"red pepper flakes","qty":null,"unit":""},{"item":"olive oil","qty":1,"unit":"tsp"},{"item":"salt","qty":null,"unit":""}],"steps":["Toast the bread.","Mash the avocado in a bowl with a squeeze of lemon and a pinch of salt.","Heat the oil in a small nonstick pan over medium heat, crack in the egg and fry 3–4 minutes until the white is fully set (flip for 30 seconds if you prefer a firm yolk).","Spread the avocado on the toast, top with the egg, and sprinkle with red pepper flakes."]},{"id":"bacon-egg-and-cheese-sandwich","name":"Bacon, egg and cheese sandwich","meal":["breakfast","lunch"],"cuisine":"American comfort","minutes":15,"serves":1,"veg":false,"ingredients":[{"item":"bacon","qty":2,"unit":"slice"},{"item":"eggs","qty":1,"unit":""},{"item":"cheese","qty":1,"unit":"slice"},{"item":"bread","qty":2,"unit":"slice","note":"or 1 English muffin"},{"item":"butter","qty":1,"unit":"tsp"},{"item":"black pepper","qty":null,"unit":""}],"steps":["Lay the bacon in a cold skillet, then turn the heat to medium and cook 6–8 minutes, turning occasionally, until crisp. Drain on a paper towel.","Pour off most of the fat, add the butter, crack in the egg and fry 3–4 minutes, flipping once, until the white and yolk are set.","Lay the cheese on the egg for the last 30 seconds so it melts; meanwhile toast the bread.","Stack the egg, cheese and bacon between the toast, add a little pepper, and serve."]},{"id":"baked-chickpea-patties","name":"Baked chickpea patties","meal":["lunch","dinner"],"cuisine":"Mediterranean","minutes":35,"serves":4,"veg":true,"ingredients":[{"item":"canned chickpeas","qty":1,"unit":"can","note":"15 oz, drained and patted dry"},{"item":"breadcrumbs","qty":0.5,"unit":"cup"},{"item":"eggs","qty":1,"unit":""},{"item":"garlic","qty":2,"unit":"clove","note":"minced"},{"item":"cumin","qty":1,"unit":"tsp"},{"item":"fresh herbs","qty":null,"unit":"","note":"parsley or cilantro, chopped","optional":true},{"item":"olive oil","qty":2,"unit":"tbsp"},{"item":"yogurt","qty":0.5,"unit":"cup","note":"for dipping","optional":true},{"item":"salt","qty":null,"unit":""}],"steps":["Heat the oven to 400°F and line a baking sheet with parchment.","Mash the chickpeas well with a fork or potato masher, then mix in the breadcrumbs, egg, garlic, cumin, herbs, and 1/2 tsp salt.","Shape into 8 small patties about 1/2 inch thick, place on the sheet, and brush the tops with olive oil.","Bake 20–25 minutes, flipping halfway, until golden and firm. Serve in pita or with yogurt for dipping."]},{"id":"baked-oatmeal","name":"Baked oatmeal","meal":["breakfast"],"cuisine":"American comfort","minutes":45,"serves":6,"veg":true,"ingredients":[{"item":"oats","qty":2,"unit":"cup","note":"rolled"},{"item":"milk","qty":1.5,"unit":"cup"},{"item":"eggs","qty":2,"unit":""},{"item":"maple syrup","qty":0.33,"unit":"cup"},{"item":"baking powder","qty":1,"unit":"tsp"},{"item":"cinnamon","qty":1,"unit":"tsp"},{"item":"butter","qty":2,"unit":"tbsp","note":"melted, plus extra for greasing"},{"item":"berries","qty":1,"unit":"cup"},{"item":"salt","qty":0.25,"unit":"tsp"}],"steps":["Heat the oven to 375°F and grease an 8x8-inch baking dish with butter.","In a bowl, mix the oats, baking powder, cinnamon and salt.","In another bowl, whisk the milk, eggs, maple syrup and melted butter, then stir into the oat mixture.","Fold in the berries, pour into the dish and spread level.","Bake 35–40 minutes until golden on top and set in the center. Cool 5 minutes, then cut into squares."]},{"id":"baked-salmon-lemon-herbs","name":"Baked salmon with lemon and herbs","meal":["dinner"],"cuisine":"Mediterranean","minutes":20,"serves":4,"veg":false,"ingredients":[{"item":"salmon","qty":4,"unit":"piece","note":"fillets, about 6 oz each"},{"item":"lemon","qty":1,"unit":"","note":"half juiced, half sliced"},{"item":"garlic","qty":2,"unit":"clove","note":"minced"},{"item":"fresh herbs","qty":null,"unit":"","note":"parsley or dill, chopped"},{"item":"italian seasoning","qty":1,"unit":"tsp","note":"if you have no fresh herbs","optional":true},{"item":"olive oil","qty":2,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Heat the oven to 400°F and line a baking sheet with foil or parchment.","Place the salmon skin-side down and season with salt and pepper. Mix the olive oil, lemon juice, garlic, and herbs (or italian seasoning) and spoon over the fillets; top with lemon slices.","Bake 12–15 minutes until the salmon is opaque and flakes easily with a fork (145°F in the thickest part).","Serve with the pan juices spooned over."]},{"id":"baked-ziti","name":"Baked ziti","meal":["dinner"],"cuisine":"Italian","minutes":50,"serves":6,"veg":true,"ingredients":[{"item":"pasta","qty":1,"unit":"lb","note":"ziti or penne"},{"item":"pasta sauce","qty":24,"unit":"oz","note":"1 jar marinara"},{"item":"mozzarella","qty":2,"unit":"cup","note":"shredded"},{"item":"parmesan","qty":0.5,"unit":"cup","note":"grated"},{"item":"cream cheese","qty":4,"unit":"oz","note":"softened (stands in for ricotta)","optional":true},{"item":"italian seasoning","qty":1,"unit":"tsp"},{"item":"salt","qty":null,"unit":""}],"steps":["Heat the oven to 375°F. Cook the pasta in salted boiling water for 2 minutes less than the package says, then drain.","In the empty pot, stir the marinara, italian seasoning, and cream cheese (if using) over low heat until smooth, then mix in the pasta and half the mozzarella.","Spread in a 9x13-inch baking dish and top with the remaining mozzarella and the parmesan.","Bake uncovered 20–25 minutes until bubbling and the cheese is melted and golden in spots. Rest 5 minutes before serving."]},{"id":"banana-bread","name":"Banana bread","meal":["breakfast","snack"],"cuisine":"Classic","minutes":80,"serves":10,"veg":true,"ingredients":[{"item":"bananas","qty":3,"unit":"","note":"very ripe"},{"item":"butter","qty":0.33,"unit":"cup","note":"melted"},{"item":"sugar","qty":0.75,"unit":"cup","note":"white or brown"},{"item":"eggs","qty":1,"unit":""},{"item":"vanilla","qty":1,"unit":"tsp"},{"item":"baking powder","qty":2,"unit":"tsp"},{"item":"salt","qty":0.25,"unit":"tsp"},{"item":"flour","qty":1.5,"unit":"cup"},{"item":"cinnamon","qty":0.5,"unit":"tsp","optional":true}],"steps":["Heat the oven to 350°F and grease a 9x5-inch loaf pan.","Mash the bananas in a large bowl, then stir in the melted butter, sugar, egg and vanilla.","Sprinkle the baking powder, salt and cinnamon if using over the top and stir, then fold in the flour until just combined (a few lumps are fine).","Pour into the pan and bake 55–65 minutes until golden and a toothpick in the center comes out clean.","Cool in the pan 10 minutes, then turn out onto a rack before slicing."]},{"id":"banana-oat-pancakes","name":"Banana oat pancakes","meal":["breakfast"],"cuisine":"Classic","minutes":20,"serves":2,"veg":true,"ingredients":[{"item":"bananas","qty":1,"unit":"","note":"ripe"},{"item":"eggs","qty":2,"unit":""},{"item":"oats","qty":0.5,"unit":"cup","note":"rolled"},{"item":"baking powder","qty":0.5,"unit":"tsp"},{"item":"cinnamon","qty":0.25,"unit":"tsp"},{"item":"butter","qty":1,"unit":"tbsp"}],"steps":["Mash the banana well in a bowl with a fork.","Whisk in the eggs, then stir in the oats, baking powder and cinnamon; let sit 5 minutes to thicken.","Melt a little of the butter in a nonstick pan over medium-low heat.","Spoon in 2 tbsp of batter per pancake and cook 2–3 minutes until the edges are set and the bottom is golden.","Flip gently and cook 1–2 minutes more until cooked through, adding more butter as needed."]},{"id":"bean-and-cheese-burrito","name":"Bean and cheese burrito","meal":["lunch","dinner"],"cuisine":"Tex-Mex","minutes":15,"serves":2,"veg":true,"ingredients":[{"item":"canned black beans","qty":1,"unit":"can","note":"15 oz, drained and rinsed"},{"item":"cumin","qty":0.5,"unit":"tsp"},{"item":"garlic powder","qty":0.5,"unit":"tsp"},{"item":"tortillas","qty":2,"unit":"","note":"large flour"},{"item":"cheese","qty":0.75,"unit":"cup","note":"shredded"},{"item":"salsa","qty":0.25,"unit":"cup"},{"item":"salt","qty":null,"unit":""}],"steps":["Put the black beans in a small pot with the cumin, garlic powder, a pinch of salt and 3 tbsp water.","Cook over medium heat 5 minutes, mashing about half the beans with a fork, until thick and hot.","Warm the tortillas in a dry pan or the microwave for 20 seconds so they bend without cracking.","Spread the beans down the middle of each tortilla, top with cheese and salsa, fold in the sides and roll up tightly.","Optional: toast the burritos seam-side down in a pan over medium heat for 2 minutes per side until golden."]},{"id":"beef-and-broccoli","name":"Beef and broccoli","meal":["dinner"],"cuisine":"Chinese","minutes":25,"serves":2,"veg":false,"ingredients":[{"item":"steak","qty":12,"unit":"oz","note":"flank or sirloin, sliced thin against the grain"},{"item":"broccoli","qty":3,"unit":"cup","note":"florets"},{"item":"garlic","qty":2,"unit":"clove","note":"minced"},{"item":"soy sauce","qty":3,"unit":"tbsp"},{"item":"brown sugar","qty":1,"unit":"tbsp"},{"item":"cornstarch","qty":2,"unit":"tsp"},{"item":"vegetable oil","qty":2,"unit":"tbsp"},{"item":"rice","qty":2,"unit":"cup","note":"cooked, to serve"}],"steps":["Toss the steak with 1 tsp of the cornstarch and 1 tbsp of the soy sauce. Mix the remaining soy sauce, brown sugar, remaining cornstarch, and 1/3 cup water in a bowl.","Heat 1 tbsp oil in a large pan over high heat. Add the beef in one layer and sear 1–2 minutes per side until browned and no longer pink on the outside; move to a plate.","Add the remaining oil and the broccoli with 2 tbsp water, cover, and cook 3 minutes until bright green and crisp-tender.","Add the garlic for 30 seconds, return the beef, pour in the sauce, and stir 1–2 minutes until thickened.","Serve over rice."]},{"id":"beef-tacos","name":"Beef tacos","meal":["lunch","dinner"],"cuisine":"Tex-Mex","minutes":25,"serves":4,"veg":false,"ingredients":[{"item":"ground beef","qty":1,"unit":"lb"},{"item":"onion","qty":0.5,"unit":"","note":"finely diced"},{"item":"chili powder","qty":1,"unit":"tbsp"},{"item":"cumin","qty":1,"unit":"tsp"},{"item":"garlic powder","qty":0.5,"unit":"tsp"},{"item":"tortillas","qty":8,"unit":"","note":"small corn or flour"},{"item":"cheese","qty":1,"unit":"cup","note":"shredded"},{"item":"lettuce","qty":1,"unit":"cup","note":"shredded"},{"item":"salsa","qty":0.5,"unit":"cup"},{"item":"salt","qty":null,"unit":""}],"steps":["Put the ground beef and onion in a large skillet over medium-high heat and cook 8–10 minutes, breaking up the meat, until no pink remains and it reaches 160°F.","Spoon off most of the fat, then stir in the chili powder, cumin, garlic powder, a big pinch of salt and 1/3 cup water; simmer 3 minutes until saucy.","Warm the tortillas in a dry pan over medium heat for about 30 seconds per side.","Fill each tortilla with beef, then top with cheese, lettuce and salsa."]},{"id":"berry-smoothie","name":"Berry smoothie","meal":["breakfast","snack"],"cuisine":"Classic","minutes":5,"serves":1,"veg":true,"ingredients":[{"item":"berries","qty":1,"unit":"cup","note":"frozen"},{"item":"bananas","qty":0.5,"unit":""},{"item":"yogurt","qty":0.5,"unit":"cup"},{"item":"milk","qty":0.75,"unit":"cup"},{"item":"honey","qty":1,"unit":"tsp","optional":true}],"steps":["Add the berries, banana, yogurt and milk to a blender, plus honey if you want it sweeter.","Blend on high for 45–60 seconds until completely smooth.","Add a splash more milk if it's too thick to blend, then pour and serve."]},{"id":"black-bean-corn-quesadilla","name":"Black bean and corn quesadilla","meal":["lunch","dinner","snack"],"cuisine":"Tex-Mex","minutes":20,"serves":2,"veg":true,"ingredients":[{"item":"canned black beans","qty":0.75,"unit":"cup","note":"drained and rinsed"},{"item":"corn","qty":0.5,"unit":"cup","note":"frozen (thawed) or canned"},{"item":"cumin","qty":0.5,"unit":"tsp"},{"item":"tortillas","qty":2,"unit":"","note":"large flour"},{"item":"cheese","qty":1,"unit":"cup","note":"shredded"},{"item":"salsa","qty":0.25,"unit":"cup","optional":true,"note":"for dipping"},{"item":"butter","qty":1,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""}],"steps":["Mix the black beans, corn, cumin and a pinch of salt in a bowl, lightly mashing a few beans so the filling holds together.","Melt half the butter in a large skillet over medium heat and lay in a tortilla.","Sprinkle cheese over half the tortilla, spoon on half the bean mixture, add a little more cheese and fold over.","Cook 2–3 minutes per side until golden and the cheese melts; repeat with the remaining butter and tortilla.","Cut into wedges and serve with salsa if you like."]},{"id":"black-bean-soup","name":"Black bean soup","meal":["lunch","dinner"],"cuisine":"Mexican","minutes":35,"serves":4,"veg":true,"ingredients":[{"item":"canned black beans","qty":2,"unit":"can","note":"15 oz each, drained and rinsed"},{"item":"onion","qty":1,"unit":"","note":"diced"},{"item":"garlic","qty":3,"unit":"clove","note":"minced"},{"item":"cumin","qty":2,"unit":"tsp"},{"item":"chicken broth","qty":3,"unit":"cup","note":"use vegetable broth to keep it vegetarian"},{"item":"salsa","qty":0.5,"unit":"cup"},{"item":"lime","qty":1,"unit":""},{"item":"sour cream","qty":0.25,"unit":"cup","optional":true,"note":"for topping"},{"item":"olive oil","qty":1,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""}],"steps":["Heat the oil in a large pot over medium heat and cook the onion 5 minutes until soft, then add the garlic and cumin and stir 1 minute.","Add the black beans, broth and salsa, bring to a boil, then lower the heat and simmer 15 minutes.","Mash about half the beans with a potato masher (or blend half the soup) to thicken it.","Squeeze in the lime juice, season with salt, and serve topped with a spoonful of sour cream if you like."]},{"id":"black-bean-tostadas","name":"Black bean tostadas","meal":["lunch","dinner"],"cuisine":"Mexican","minutes":25,"serves":3,"veg":true,"ingredients":[{"item":"tortillas","qty":6,"unit":"","note":"corn"},{"item":"canned black beans","qty":1,"unit":"can","note":"15 oz, drained and rinsed"},{"item":"cumin","qty":0.5,"unit":"tsp"},{"item":"lettuce","qty":1.5,"unit":"cup","note":"shredded"},{"item":"cheese","qty":0.75,"unit":"cup","note":"shredded"},{"item":"salsa","qty":0.5,"unit":"cup"},{"item":"sour cream","qty":0.25,"unit":"cup","optional":true},{"item":"vegetable oil","qty":1,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""}],"steps":["Heat the oven to 400°F. Brush the tortillas lightly with oil on both sides, lay them on a baking sheet and bake 8–10 minutes, flipping once, until crisp and golden.","Meanwhile warm the black beans with the cumin, a pinch of salt and 2 tbsp water in a small pot over medium heat, mashing them with a fork into a rough paste, about 5 minutes.","Spread the beans over each crisp tortilla and top with lettuce, cheese, salsa and a little sour cream if you like."]},{"id":"blt","name":"BLT","meal":["lunch"],"cuisine":"Classic","minutes":15,"serves":2,"veg":false,"ingredients":[{"item":"bacon","qty":8,"unit":"slice"},{"item":"bread","qty":4,"unit":"slice","note":"toasted"},{"item":"lettuce","qty":4,"unit":"","note":"leaves"},{"item":"tomatoes","qty":1,"unit":"","note":"sliced"},{"item":"mayo","qty":2,"unit":"tbsp"},{"item":"black pepper","qty":null,"unit":""}],"steps":["Lay the bacon in a cold skillet, set over medium heat and cook 8–10 minutes, turning, until crisp. Drain on paper towels.","Toast the bread and spread one side of each slice with mayo.","Layer lettuce, tomato slices (with a little pepper) and 4 slices of bacon on two pieces of toast, top with the rest, and cut in half."]},{"id":"breakfast-burrito","name":"Breakfast burrito","meal":["breakfast","lunch"],"cuisine":"Mexican","minutes":15,"serves":2,"veg":true,"ingredients":[{"item":"eggs","qty":4,"unit":""},{"item":"tortillas","qty":2,"unit":"","note":"large flour"},{"item":"canned black beans","qty":0.5,"unit":"cup","note":"drained and rinsed"},{"item":"cheese","qty":0.5,"unit":"cup","note":"shredded"},{"item":"salsa","qty":4,"unit":"tbsp"},{"item":"butter","qty":1,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""}],"steps":["Whisk the eggs with a pinch of salt.","Warm the black beans in a small pan or the microwave for 1–2 minutes until hot.","Melt the butter in a nonstick pan over medium-low heat, add the eggs and stir for 2–3 minutes until set.","Warm the tortillas in a dry pan or microwave for 20 seconds so they fold without cracking.","Fill each tortilla with eggs, beans, cheese and salsa, fold in the sides and roll up tightly."]},{"id":"breakfast-potato-hash","name":"Breakfast potato hash","meal":["breakfast","lunch"],"cuisine":"American comfort","minutes":30,"serves":2,"veg":true,"ingredients":[{"item":"potatoes","qty":1,"unit":"lb","note":"cut into 1/2-inch cubes"},{"item":"onion","qty":1,"unit":"","note":"diced"},{"item":"bell pepper","qty":1,"unit":"","note":"diced"},{"item":"paprika","qty":1,"unit":"tsp"},{"item":"eggs","qty":2,"unit":"","optional":true},{"item":"vegetable oil","qty":2,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Microwave the cubed potatoes in a covered bowl for 4–5 minutes until just tender when poked with a fork.","Heat the oil in a large skillet over medium-high heat. Add the potatoes in one layer and cook 6–8 minutes, turning occasionally, until golden and crisp.","Add the onion, bell pepper, paprika and a good pinch of salt and pepper; cook 5–6 minutes more until the vegetables are soft.","If adding eggs, make two wells, crack in the eggs, cover and cook on medium-low 4–5 minutes until the whites are set."]},{"id":"breakfast-quesadilla","name":"Breakfast quesadilla","meal":["breakfast","lunch"],"cuisine":"Mexican","minutes":15,"serves":1,"veg":true,"ingredients":[{"item":"tortillas","qty":1,"unit":"","note":"large flour"},{"item":"eggs","qty":2,"unit":""},{"item":"cheese","qty":0.5,"unit":"cup","note":"shredded"},{"item":"salsa","qty":2,"unit":"tbsp","note":"for serving"},{"item":"butter","qty":1,"unit":"tsp"},{"item":"salt","qty":null,"unit":""}],"steps":["Whisk the eggs with a pinch of salt. Melt the butter in a nonstick pan over medium-low heat and scramble the eggs 2–3 minutes until set; move to a plate.","Wipe the pan, lay the tortilla in it and sprinkle half of it with half the cheese, then the eggs, then the rest of the cheese.","Fold the tortilla over and cook on medium heat 2–3 minutes per side until golden and crisp and the cheese is melted.","Cut into wedges and serve with the salsa."]},{"id":"broccoli-cheddar-soup","name":"Broccoli cheddar soup","meal":["lunch","dinner"],"cuisine":"American comfort","minutes":40,"serves":4,"veg":true,"ingredients":[{"item":"butter","qty":3,"unit":"tbsp"},{"item":"onion","qty":1,"unit":"","note":"diced"},{"item":"carrots","qty":1,"unit":"","note":"grated"},{"item":"flour","qty":3,"unit":"tbsp"},{"item":"chicken broth","qty":3,"unit":"cup","note":"use vegetable broth to keep it vegetarian"},{"item":"milk","qty":2,"unit":"cup"},{"item":"broccoli","qty":4,"unit":"cup","note":"small florets"},{"item":"cheese","qty":2,"unit":"cup","note":"shredded sharp cheddar"},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Melt the butter in a large pot over medium heat and cook the onion 5 minutes until soft.","Stir in the flour and cook 1 minute, then slowly whisk in the broth and milk.","Add the broccoli and carrots, bring to a gentle simmer (not a hard boil) and cook 15–20 minutes until the broccoli is tender.","Turn the heat to low and stir in the cheese a handful at a time until melted. Season with salt and pepper; blend part of it if you like it smoother."]},{"id":"bruschetta","name":"Bruschetta","meal":["snack","lunch"],"cuisine":"Italian","minutes":15,"serves":4,"veg":true,"ingredients":[{"item":"bread","qty":8,"unit":"slice","note":"baguette or crusty bread, 1/2 inch thick"},{"item":"tomatoes","qty":3,"unit":"","note":"ripe, diced"},{"item":"garlic","qty":2,"unit":"clove","note":"1 minced, 1 halved"},{"item":"fresh herbs","qty":null,"unit":"","note":"basil, chopped"},{"item":"olive oil","qty":3,"unit":"tbsp"},{"item":"vinegar","qty":1,"unit":"tsp","note":"balsamic if you have it","optional":true},{"item":"salt","qty":null,"unit":""}],"steps":["Mix the tomatoes, minced garlic, basil, 2 tbsp olive oil, vinegar if using, and 1/2 tsp salt in a bowl; let sit 5 minutes.","Brush the bread slices with the remaining oil and toast under the broiler on high (or in a toaster) 1–2 minutes per side until golden and crisp.","Rub the warm toast with the cut side of the halved garlic clove.","Spoon the tomato mixture onto the toast just before serving so it stays crisp."]},{"id":"butter-chicken","name":"Butter chicken","meal":["dinner"],"cuisine":"Indian-style","minutes":40,"serves":4,"veg":false,"ingredients":[{"item":"chicken thighs","qty":1.5,"unit":"lb","note":"boneless, skinless, cut into bite-size pieces"},{"item":"butter","qty":3,"unit":"tbsp"},{"item":"onion","qty":1,"unit":"","note":"finely diced"},{"item":"garlic","qty":3,"unit":"clove","note":"minced"},{"item":"ginger","qty":1,"unit":"tbsp","note":"grated"},{"item":"curry powder","qty":1,"unit":"tbsp","note":"or garam masala"},{"item":"tomato paste","qty":3,"unit":"tbsp"},{"item":"heavy cream","qty":0.5,"unit":"cup"},{"item":"sugar","qty":1,"unit":"tsp"},{"item":"salt","qty":null,"unit":""}],"steps":["Melt 2 tbsp butter in a large pan over medium heat. Cook the onion 6 minutes until soft and light golden.","Add the garlic, ginger, and curry powder and stir 1 minute, then stir in the tomato paste and cook 1 minute.","Add the chicken and stir to coat, then pour in 3/4 cup water and simmer, covered, 12–15 minutes until the chicken reaches 165°F inside.","Stir in the cream, sugar, remaining butter, and salt to taste, and simmer 2–3 minutes until creamy.","Serve with rice or naan."]},{"id":"cacio-e-pepe","name":"Cacio e pepe","meal":["lunch","dinner"],"cuisine":"Italian","minutes":20,"serves":2,"veg":true,"ingredients":[{"item":"pasta","qty":8,"unit":"oz","note":"spaghetti"},{"item":"parmesan","qty":1,"unit":"cup","note":"very finely grated (or pecorino)"},{"item":"black pepper","qty":2,"unit":"tsp","note":"freshly cracked"},{"item":"butter","qty":2,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""}],"steps":["Cook the spaghetti in a pot of lightly salted boiling water (use less water than usual so it gets starchy) until just al dente; save 1 1/2 cups pasta water, then drain.","In a large pan over medium heat, toast the black pepper 1 minute until fragrant, then add the butter and 1/2 cup pasta water and let it bubble.","Turn the heat to low, add the spaghetti, and toss. Take the pan off the heat and add the parmesan a handful at a time, tossing constantly and adding splashes of pasta water, until a smooth, creamy sauce forms.","Serve right away with extra pepper and cheese on top."]},{"id":"caprese-salad","name":"Caprese salad","meal":["lunch","snack"],"cuisine":"Italian","minutes":10,"serves":2,"veg":true,"ingredients":[{"item":"tomatoes","qty":2,"unit":"","note":"large ripe, sliced"},{"item":"mozzarella","qty":8,"unit":"oz","note":"fresh ball, sliced"},{"item":"fresh herbs","qty":null,"unit":"","note":"basil leaves"},{"item":"olive oil","qty":2,"unit":"tbsp"},{"item":"vinegar","qty":1,"unit":"tsp","note":"balsamic if you have it","optional":true},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Arrange the tomato and mozzarella slices on a plate, overlapping and alternating.","Tuck basil leaves between the slices.","Drizzle with the olive oil and a little vinegar if using, then sprinkle with salt and pepper and serve right away."]},{"id":"chana-masala","name":"Chana masala","meal":["lunch","dinner"],"cuisine":"Indian-style","minutes":30,"serves":4,"veg":true,"ingredients":[{"item":"canned chickpeas","qty":2,"unit":"can","note":"15 oz each, drained and rinsed"},{"item":"canned tomatoes","qty":1,"unit":"can","note":"14.5 oz, diced or crushed"},{"item":"onion","qty":1,"unit":"","note":"finely diced"},{"item":"garlic","qty":3,"unit":"clove","note":"minced"},{"item":"ginger","qty":1,"unit":"tbsp","note":"grated"},{"item":"curry powder","qty":1,"unit":"tbsp","note":"or garam masala"},{"item":"cumin","qty":1,"unit":"tsp"},{"item":"lemon","qty":0.5,"unit":""},{"item":"fresh herbs","qty":null,"unit":"","note":"cilantro, to garnish","optional":true},{"item":"vegetable oil","qty":2,"unit":"tbsp"}],"steps":["Heat the oil in a large pot over medium heat. Cook the onion 6–8 minutes until golden.","Add the garlic, ginger, curry powder, and cumin and stir 1 minute until fragrant.","Add the tomatoes and cook 5 minutes, stirring, until slightly thickened.","Stir in the chickpeas and 1/2 cup water, then simmer 10 minutes, mashing a few chickpeas to thicken the sauce.","Squeeze in the lemon juice, season with salt, and top with cilantro. Serve with rice or naan."]},{"id":"cheese-enchiladas","name":"Cheese enchiladas","meal":["dinner"],"cuisine":"Tex-Mex","minutes":40,"serves":4,"veg":true,"ingredients":[{"item":"canned tomatoes","qty":1,"unit":"can","note":"15 oz crushed"},{"item":"salsa","qty":1,"unit":"cup"},{"item":"chili powder","qty":1,"unit":"tbsp"},{"item":"cumin","qty":1,"unit":"tsp"},{"item":"tortillas","qty":8,"unit":"","note":"corn or small flour"},{"item":"cheese","qty":3,"unit":"cup","note":"shredded"},{"item":"onion","qty":0.5,"unit":"","note":"finely diced"},{"item":"salt","qty":null,"unit":""}],"steps":["Heat the oven to 375°F. Stir the crushed tomatoes, salsa, chili powder, cumin and 1/2 tsp salt together in a bowl to make the sauce.","Spread 1/2 cup of the sauce over the bottom of a 9x13-inch baking dish.","Warm the tortillas in the microwave for 30 seconds so they bend, then fill each with a small handful of cheese and some onion, roll up and lay seam-side down in the dish.","Pour the remaining sauce over the top and sprinkle with the rest of the cheese.","Bake 20 minutes until bubbling and the cheese is melted; rest 5 minutes before serving."]},{"id":"cheese-omelette","name":"Cheese omelette","meal":["breakfast","lunch"],"cuisine":"Classic","minutes":10,"serves":1,"veg":true,"ingredients":[{"item":"eggs","qty":3,"unit":""},{"item":"butter","qty":1,"unit":"tbsp"},{"item":"cheese","qty":0.25,"unit":"cup","note":"shredded"},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Whisk the eggs with a pinch of salt and pepper until no streaks remain.","Melt the butter in a nonstick pan over medium-low heat until it foams.","Pour in the eggs and gently pull the edges toward the center as they set, tilting the pan so raw egg runs underneath.","When the top is just set but still glossy, scatter the cheese over one half, fold, and slide onto a plate."]},{"id":"chicken-burrito-bowl","name":"Chicken burrito bowl","meal":["lunch","dinner"],"cuisine":"Tex-Mex","minutes":30,"serves":2,"veg":false,"ingredients":[{"item":"chicken breast","qty":12,"unit":"oz"},{"item":"chili powder","qty":2,"unit":"tsp"},{"item":"cumin","qty":1,"unit":"tsp"},{"item":"rice","qty":2,"unit":"cup","note":"cooked"},{"item":"canned black beans","qty":1,"unit":"can","note":"15 oz, drained and rinsed"},{"item":"corn","qty":0.5,"unit":"cup","note":"frozen or canned"},{"item":"salsa","qty":0.5,"unit":"cup"},{"item":"lime","qty":1,"unit":""},{"item":"vegetable oil","qty":1,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""}],"steps":["Rub the chicken all over with the chili powder, cumin and 1/2 tsp salt.","Heat the oil in a skillet over medium-high heat and cook the chicken 5–7 minutes per side until it reaches 165°F in the thickest part; rest 5 minutes, then slice.","Meanwhile warm the black beans and corn together in a small pot over medium heat for 4–5 minutes.","Heat the rice in the microwave for 2 minutes and squeeze in half the lime.","Divide the rice between bowls and top with beans, corn, sliced chicken and salsa; serve with the remaining lime cut into wedges."]},{"id":"chicken-caesar-style-wrap","name":"Chicken Caesar-style wrap","meal":["lunch"],"cuisine":"Classic","minutes":25,"serves":2,"veg":false,"ingredients":[{"item":"chicken breast","qty":8,"unit":"oz"},{"item":"olive oil","qty":1,"unit":"tbsp"},{"item":"garlic","qty":1,"unit":"clove","note":"grated"},{"item":"mayo","qty":3,"unit":"tbsp"},{"item":"lemon","qty":0.5,"unit":"","note":"juiced"},{"item":"parmesan","qty":0.25,"unit":"cup","note":"grated"},{"item":"lettuce","qty":2,"unit":"cup","note":"romaine, chopped"},{"item":"tortillas","qty":2,"unit":"","note":"large"},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Season the chicken with salt and pepper. Heat the oil in a skillet over medium-high heat and cook the chicken 5–7 minutes per side until it reaches 165°F; rest 5 minutes, then slice.","Whisk the garlic, mayo, lemon juice, half the parmesan and plenty of pepper into a dressing.","Toss the lettuce with the dressing and the remaining parmesan.","Divide the salad and chicken between the tortillas, fold in the sides, roll up tightly and cut in half."]},{"id":"chicken-fajitas","name":"Chicken fajitas","meal":["dinner"],"cuisine":"Tex-Mex","minutes":30,"serves":4,"veg":false,"ingredients":[{"item":"chicken breast","qty":1,"unit":"lb","note":"cut into thin strips"},{"item":"bell pepper","qty":2,"unit":"","note":"sliced into strips"},{"item":"onion","qty":1,"unit":"","note":"sliced"},{"item":"chili powder","qty":2,"unit":"tsp"},{"item":"cumin","qty":1,"unit":"tsp"},{"item":"garlic powder","qty":0.5,"unit":"tsp"},{"item":"lime","qty":1,"unit":""},{"item":"tortillas","qty":8,"unit":"","note":"flour"},{"item":"vegetable oil","qty":2,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""}],"steps":["Toss the chicken with the chili powder, cumin, garlic powder, 1 tsp salt and 1 tbsp oil.","Heat a large skillet over medium-high heat and cook the chicken 6–8 minutes, stirring, until it reaches 165°F; move to a plate.","Add the remaining oil, then the bell pepper and onion; cook 5–6 minutes until soft and a little charred at the edges.","Return the chicken to the pan, squeeze over the lime juice and toss.","Warm the tortillas in a dry pan or microwave and fill with the chicken and vegetables."]},{"id":"chicken-fried-rice","name":"Chicken fried rice","meal":["lunch","dinner"],"cuisine":"Chinese","minutes":20,"serves":2,"veg":false,"ingredients":[{"item":"rice","qty":3,"unit":"cup","note":"cooked, ideally a day old"},{"item":"chicken breast","qty":8,"unit":"oz","note":"diced small"},{"item":"eggs","qty":2,"unit":""},{"item":"onion","qty":0.5,"unit":"","note":"diced"},{"item":"frozen peas","qty":0.5,"unit":"cup"},{"item":"soy sauce","qty":2,"unit":"tbsp"},{"item":"vegetable oil","qty":2,"unit":"tbsp"}],"steps":["Heat 1 tbsp oil in a large pan over high heat. Add the chicken and cook 5–6 minutes, stirring, until no longer pink inside and it reaches 165°F; move to a plate.","Add the remaining oil, then the onion and peas; cook 2 minutes.","Push everything aside, crack in the eggs, and scramble until just set.","Add the rice, breaking up clumps, and fry 3 minutes until hot. Return the chicken, add the soy sauce, toss and serve."]},{"id":"chicken-katsu","name":"Chicken katsu","meal":["dinner"],"cuisine":"Japanese","minutes":30,"serves":2,"veg":false,"ingredients":[{"item":"chicken breast","qty":2,"unit":"","note":"halved horizontally into thin cutlets"},{"item":"flour","qty":0.25,"unit":"cup"},{"item":"eggs","qty":1,"unit":"","note":"beaten"},{"item":"breadcrumbs","qty":1,"unit":"cup","note":"panko"},{"item":"ketchup","qty":2,"unit":"tbsp","note":"for the sauce"},{"item":"soy sauce","qty":1,"unit":"tbsp","note":"for the sauce"},{"item":"honey","qty":1,"unit":"tsp","note":"for the sauce"},{"item":"vegetable oil","qty":0.5,"unit":"cup"},{"item":"salt","qty":null,"unit":""}],"steps":["Season the chicken cutlets with salt. Set out three plates: flour, beaten egg, and panko breadcrumbs.","Coat each cutlet in flour, dip in egg, then press firmly into the panko on both sides.","Heat the oil in a large skillet over medium heat until a crumb sizzles. Fry the chicken 4–5 minutes per side until deep golden and it reaches 165°F inside.","Drain on a paper towel and rest 2 minutes. Meanwhile stir the ketchup, soy sauce, and honey together for a quick katsu sauce.","Slice the chicken into strips and serve with the sauce and rice or shredded cabbage."]},{"id":"chicken-lo-mein","name":"Chicken lo mein","meal":["dinner"],"cuisine":"Chinese","minutes":30,"serves":3,"veg":false,"ingredients":[{"item":"pasta","qty":8,"unit":"oz","note":"spaghetti or lo mein noodles"},{"item":"chicken breast","qty":12,"unit":"oz","note":"thinly sliced"},{"item":"cabbage","qty":2,"unit":"cup","note":"shredded"},{"item":"carrots","qty":1,"unit":"","note":"cut into matchsticks"},{"item":"garlic","qty":2,"unit":"clove","note":"minced"},{"item":"soy sauce","qty":3,"unit":"tbsp"},{"item":"brown sugar","qty":1,"unit":"tsp"},{"item":"sesame oil","qty":1,"unit":"tsp"},{"item":"vegetable oil","qty":2,"unit":"tbsp"}],"steps":["Cook the noodles in boiling water according to the package, drain, and rinse briefly. Mix the soy sauce, brown sugar, and sesame oil in a small bowl.","Heat 1 tbsp oil in a large pan over high heat. Stir-fry the chicken 5–6 minutes until no longer pink inside and it reaches 165°F; move to a plate.","Add the remaining oil, the carrots, and the cabbage and stir-fry 3 minutes until softened. Add the garlic for 30 seconds.","Add the noodles, chicken, and sauce and toss 1–2 minutes until everything is hot and coated."]},{"id":"chicken-noodle-soup","name":"Chicken noodle soup","meal":["lunch","dinner"],"cuisine":"Classic","minutes":45,"serves":6,"veg":false,"ingredients":[{"item":"olive oil","qty":1,"unit":"tbsp"},{"item":"onion","qty":1,"unit":"","note":"diced"},{"item":"carrots","qty":2,"unit":"","note":"sliced"},{"item":"celery","qty":2,"unit":"","note":"stalks, sliced"},{"item":"chicken broth","qty":8,"unit":"cup"},{"item":"chicken breast","qty":1,"unit":"lb"},{"item":"italian seasoning","qty":1,"unit":"tsp"},{"item":"pasta","qty":2,"unit":"cup","note":"egg noodles or small pasta"},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""},{"item":"fresh herbs","qty":null,"unit":"","note":"chopped parsley","optional":true}],"steps":["Heat the oil in a large pot over medium heat; cook the onion, carrots and celery 5–6 minutes until starting to soften.","Add the broth, italian seasoning and whole chicken breasts. Bring to a boil, then lower to a gentle simmer and cook 15–20 minutes until the chicken reaches 165°F.","Lift out the chicken, shred it with two forks and set aside.","Bring the soup back to a boil, add the noodles and cook according to the package, about 6–8 minutes, until tender.","Stir the chicken back in, season with salt and pepper, and top with herbs if you like."]},{"id":"chicken-parmesan","name":"Chicken parmesan","meal":["dinner"],"cuisine":"Italian","minutes":45,"serves":4,"veg":false,"ingredients":[{"item":"chicken breast","qty":2,"unit":"","note":"large, sliced in half horizontally into 4 cutlets"},{"item":"eggs","qty":1,"unit":""},{"item":"breadcrumbs","qty":1,"unit":"cup"},{"item":"parmesan","qty":0.5,"unit":"cup","note":"grated, divided"},{"item":"pasta sauce","qty":1.5,"unit":"cup","note":"marinara"},{"item":"mozzarella","qty":1,"unit":"cup","note":"shredded"},{"item":"vegetable oil","qty":3,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""}],"steps":["Heat the oven to 425°F. Season the chicken cutlets with salt. Beat the egg in a shallow bowl; mix the breadcrumbs with half the parmesan in another.","Dip each cutlet in egg, then press into the breadcrumb mix to coat.","Heat the oil in a large oven-safe skillet over medium-high heat and fry the cutlets 2–3 minutes per side until golden and crisp.","Spoon the marinara over the chicken and top with the mozzarella and remaining parmesan.","Bake 10–12 minutes until the cheese is bubbly and the chicken reaches 165°F inside. Serve with pasta or salad."]},{"id":"chicken-piccata","name":"Chicken piccata","meal":["dinner"],"cuisine":"Italian","minutes":30,"serves":4,"veg":false,"ingredients":[{"item":"chicken breast","qty":2,"unit":"","note":"large, sliced in half horizontally into 4 thin cutlets"},{"item":"flour","qty":0.33,"unit":"cup"},{"item":"lemon","qty":1,"unit":"","note":"juiced"},{"item":"chicken broth","qty":0.75,"unit":"cup"},{"item":"butter","qty":3,"unit":"tbsp"},{"item":"garlic","qty":2,"unit":"clove","note":"minced"},{"item":"olive oil","qty":2,"unit":"tbsp"},{"item":"fresh herbs","qty":null,"unit":"","note":"chopped parsley","optional":true},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Season the chicken cutlets with salt and pepper, then dredge in the flour and shake off the extra.","Heat the olive oil and 1 tbsp butter in a large skillet over medium-high heat. Cook the chicken 3–4 minutes per side until golden and it reaches 165°F; move to a plate.","Lower to medium, add the garlic for 30 seconds, then pour in the broth and lemon juice, scraping up the browned bits. Simmer 3–4 minutes until reduced by about half.","Turn off the heat, swirl in the remaining butter, return the chicken to coat it in the sauce, and top with parsley."]},{"id":"chicken-quesadilla","name":"Chicken quesadilla","meal":["lunch","dinner","snack"],"cuisine":"Tex-Mex","minutes":25,"serves":2,"veg":false,"ingredients":[{"item":"chicken breast","qty":8,"unit":"oz","note":"cut into thin strips"},{"item":"chili powder","qty":1,"unit":"tsp"},{"item":"tortillas","qty":2,"unit":"","note":"large flour"},{"item":"cheese","qty":1,"unit":"cup","note":"shredded"},{"item":"vegetable oil","qty":1,"unit":"tbsp"},{"item":"salsa","qty":0.25,"unit":"cup","optional":true,"note":"for dipping"},{"item":"sour cream","qty":0.25,"unit":"cup","optional":true,"note":"for dipping"},{"item":"salt","qty":null,"unit":""}],"steps":["Toss the chicken with the chili powder and a pinch of salt.","Heat the oil in a large skillet over medium-high heat and cook the chicken 6–8 minutes, stirring, until no longer pink inside and it reaches 165°F; move to a plate and wipe out the pan.","Lay a tortilla in the pan over medium heat, sprinkle cheese over half, add half the chicken, then a little more cheese and fold it over.","Cook 2–3 minutes per side until golden and the cheese melts; repeat with the second tortilla.","Cut into wedges and serve with salsa and sour cream if you like."]},{"id":"chicken-salad","name":"Chicken salad","meal":["lunch"],"cuisine":"Classic","minutes":35,"serves":4,"veg":false,"ingredients":[{"item":"chicken breast","qty":1,"unit":"lb"},{"item":"mayo","qty":0.5,"unit":"cup"},{"item":"celery","qty":2,"unit":"","note":"stalks, diced"},{"item":"lemon","qty":0.5,"unit":"","note":"juiced"},{"item":"mustard","qty":1,"unit":"tsp"},{"item":"green onions","qty":2,"unit":"","note":"sliced","optional":true},{"item":"bread","qty":8,"unit":"slice","note":"or serve on lettuce","optional":true},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Put the chicken in a pot, cover with salted water and bring to a boil; reduce to a gentle simmer and cook 12–15 minutes until it reaches 165°F.","Let the chicken cool 10 minutes, then dice or shred it.","Mix the mayo, lemon juice, mustard, salt and pepper in a bowl; fold in the chicken, celery and green onions if using.","Serve on bread as sandwiches or over lettuce. Keeps 3 days in the fridge."]},{"id":"chicken-souvlaki-pitas","name":"Chicken souvlaki pitas","meal":["lunch","dinner"],"cuisine":"Greek","minutes":40,"serves":4,"veg":false,"ingredients":[{"item":"chicken breast","qty":1.5,"unit":"lb","note":"cut into 1-inch cubes"},{"item":"lemon","qty":1,"unit":"","note":"juiced"},{"item":"garlic","qty":3,"unit":"clove","note":"minced, divided"},{"item":"italian seasoning","qty":2,"unit":"tsp","note":"dried oregano"},{"item":"olive oil","qty":3,"unit":"tbsp"},{"item":"pita","qty":4,"unit":"","note":"warmed"},{"item":"yogurt","qty":1,"unit":"cup","note":"plain Greek"},{"item":"cucumber","qty":0.5,"unit":"","note":"grated and squeezed dry"},{"item":"tomatoes","qty":1,"unit":"","note":"sliced"},{"item":"red onion","qty":0.25,"unit":"","note":"thinly sliced"},{"item":"salt","qty":null,"unit":""}],"steps":["Toss the chicken with the lemon juice, 2 tbsp olive oil, two-thirds of the garlic, the oregano, and 1 tsp salt; marinate 15 minutes (or up to 8 hours in the fridge).","Make tzatziki: mix the yogurt, grated cucumber, remaining garlic, and a pinch of salt.","Heat the remaining oil in a large skillet over medium-high heat and cook the chicken 8–10 minutes, turning, until golden and it reaches 165°F.","Fill each warm pita with chicken, tzatziki, tomato, and red onion."]},{"id":"chicken-tortilla-soup","name":"Chicken tortilla soup","meal":["lunch","dinner"],"cuisine":"Mexican","minutes":40,"serves":4,"veg":false,"ingredients":[{"item":"chicken breast","qty":1,"unit":"lb"},{"item":"onion","qty":1,"unit":"","note":"diced"},{"item":"garlic","qty":3,"unit":"clove","note":"minced"},{"item":"chili powder","qty":2,"unit":"tsp"},{"item":"cumin","qty":1,"unit":"tsp"},{"item":"chicken broth","qty":4,"unit":"cup"},{"item":"canned tomatoes","qty":1,"unit":"can","note":"15 oz diced"},{"item":"corn","qty":1,"unit":"cup","note":"frozen"},{"item":"tortillas","qty":4,"unit":"","note":"corn, cut into thin strips"},{"item":"lime","qty":1,"unit":""},{"item":"vegetable oil","qty":2,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""}],"steps":["Heat 1 tbsp oil in a large pot over medium heat and cook the onion 5 minutes until soft; add the garlic, chili powder and cumin and stir 1 minute.","Add the broth, tomatoes and whole chicken breasts, bring to a boil, then cover and simmer on low 15–20 minutes until the chicken reaches 165°F.","While it simmers, toss the tortilla strips with the remaining oil and a pinch of salt and bake at 400°F for 8–10 minutes until crisp.","Lift out the chicken, shred it with two forks and return it to the pot with the corn; simmer 5 minutes more.","Squeeze in the lime juice, season with salt, and serve topped with the crispy tortilla strips."]},{"id":"chilaquiles","name":"Chilaquiles","meal":["breakfast","lunch"],"cuisine":"Mexican","minutes":25,"serves":2,"veg":true,"ingredients":[{"item":"tortillas","qty":6,"unit":"","note":"corn, each cut into 6 wedges"},{"item":"salsa","qty":1,"unit":"cup","note":"red or green"},{"item":"eggs","qty":2,"unit":""},{"item":"cheese","qty":0.5,"unit":"cup","note":"shredded or crumbled"},{"item":"sour cream","qty":2,"unit":"tbsp"},{"item":"onion","qty":0.25,"unit":"","note":"thinly sliced","optional":true},{"item":"vegetable oil","qty":3,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""}],"steps":["Heat the oil in a large skillet over medium-high heat and fry the tortilla wedges in batches 2–3 minutes, turning, until golden and crisp; drain on paper towels and sprinkle with salt.","Pour off all but a thin film of oil, add the eggs and fry over medium heat 3–4 minutes until the whites are set; move to a plate.","Pour the salsa and 1/4 cup water into the pan, simmer 1 minute, then add the chips and toss for 30 seconds so they are coated but still a little crunchy.","Top with the cheese, fried eggs, sour cream and onion and serve immediately."]},{"id":"chili-mac","name":"Chili mac","meal":["dinner"],"cuisine":"One-pot","minutes":35,"serves":4,"veg":false,"ingredients":[{"item":"ground beef","qty":1,"unit":"lb"},{"item":"onion","qty":1,"unit":"","note":"diced"},{"item":"garlic","qty":2,"unit":"clove","note":"minced"},{"item":"chili powder","qty":1,"unit":"tbsp"},{"item":"cumin","qty":1,"unit":"tsp"},{"item":"canned tomatoes","qty":1,"unit":"can","note":"14.5 oz diced, with juice"},{"item":"canned black beans","qty":1,"unit":"can","note":"drained and rinsed (kidney beans also work)"},{"item":"chicken broth","qty":2.5,"unit":"cup"},{"item":"pasta","qty":8,"unit":"oz","note":"elbow macaroni, uncooked"},{"item":"cheese","qty":1,"unit":"cup","note":"shredded cheddar"},{"item":"salt","qty":null,"unit":""}],"steps":["In a large pot over medium-high heat, cook the ground beef and onion 7–8 minutes, breaking it up, until no pink remains and it reaches 160°F. Spoon off excess fat.","Stir in the garlic, chili powder and cumin and cook 30 seconds.","Add the canned tomatoes, beans and broth and bring to a boil.","Stir in the macaroni, cover, and simmer on medium-low 10–12 minutes, stirring every few minutes, until the pasta is tender and most of the liquid is absorbed.","Season with salt, stir in half the cheese, and top with the rest. Cover 2 minutes to melt, then serve."]},{"id":"cinnamon-apple-toast","name":"Cinnamon apple toast","meal":["breakfast","snack"],"cuisine":"Classic","minutes":10,"serves":1,"veg":true,"ingredients":[{"item":"bread","qty":2,"unit":"slice"},{"item":"apples","qty":1,"unit":"","note":"thinly sliced"},{"item":"butter","qty":1,"unit":"tbsp"},{"item":"brown sugar","qty":1,"unit":"tsp"},{"item":"cinnamon","qty":0.5,"unit":"tsp"}],"steps":["Melt the butter in a small pan over medium heat. Add the apple slices, brown sugar and cinnamon.","Cook 4–5 minutes, stirring now and then, until the apples are soft and lightly caramelized.","Meanwhile toast the bread, then pile the warm apples on top and spoon over any pan juices."]},{"id":"coconut-chicken-curry","name":"Coconut chicken curry","meal":["dinner"],"cuisine":"Thai","minutes":35,"serves":4,"veg":false,"ingredients":[{"item":"chicken thighs","qty":1.5,"unit":"lb","note":"boneless, skinless, cut into bite-size pieces"},{"item":"coconut milk","qty":1,"unit":"can","note":"13.5 oz"},{"item":"onion","qty":1,"unit":"","note":"diced"},{"item":"garlic","qty":3,"unit":"clove","note":"minced"},{"item":"ginger","qty":1,"unit":"tbsp","note":"grated"},{"item":"curry powder","qty":2,"unit":"tbsp"},{"item":"bell pepper","qty":1,"unit":"","note":"sliced"},{"item":"lime","qty":0.5,"unit":""},{"item":"vegetable oil","qty":1,"unit":"tbsp"}],"steps":["Heat the oil in a large pot over medium heat. Cook the onion 5 minutes until soft.","Add the garlic, ginger, and curry powder and stir 1 minute until fragrant.","Add the chicken and stir 2 minutes to coat, then pour in the coconut milk and 1/4 cup water and bring to a simmer.","Add the bell pepper and simmer 12–15 minutes, stirring occasionally, until the chicken reaches 165°F inside.","Squeeze in the lime juice, season with salt, and serve with rice."]},{"id":"coconut-shrimp-curry","name":"Coconut shrimp curry","meal":["dinner"],"cuisine":"Indian-style","minutes":25,"serves":3,"veg":false,"ingredients":[{"item":"shrimp","qty":1,"unit":"lb","note":"peeled and deveined"},{"item":"coconut milk","qty":1,"unit":"can","note":"13.5 oz"},{"item":"onion","qty":1,"unit":"","note":"diced"},{"item":"garlic","qty":3,"unit":"clove","note":"minced"},{"item":"ginger","qty":1,"unit":"tbsp","note":"grated"},{"item":"curry powder","qty":1,"unit":"tbsp"},{"item":"tomato paste","qty":1,"unit":"tbsp"},{"item":"lime","qty":0.5,"unit":""},{"item":"vegetable oil","qty":1,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""}],"steps":["Heat the oil in a large pan over medium heat. Cook the onion 5 minutes until soft.","Add the garlic, ginger, curry powder, and tomato paste and stir 1 minute.","Pour in the coconut milk, bring to a simmer, and cook 5 minutes until slightly thickened.","Add the shrimp and simmer 3–4 minutes, stirring, until pink and opaque all the way through.","Squeeze in the lime juice, season with salt, and serve with rice."]},{"id":"cottage-pie","name":"Cottage pie","meal":["dinner"],"cuisine":"American comfort","minutes":75,"serves":6,"veg":false,"ingredients":[{"item":"potatoes","qty":2,"unit":"lb","note":"peeled and cut in chunks"},{"item":"butter","qty":3,"unit":"tbsp"},{"item":"milk","qty":0.5,"unit":"cup"},{"item":"ground beef","qty":1,"unit":"lb"},{"item":"onion","qty":1,"unit":"","note":"diced"},{"item":"carrots","qty":2,"unit":"","note":"diced"},{"item":"tomato paste","qty":2,"unit":"tbsp"},{"item":"flour","qty":1,"unit":"tbsp"},{"item":"chicken broth","qty":1,"unit":"cup","note":"beef broth also works"},{"item":"frozen peas","qty":0.5,"unit":"cup"},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Heat the oven to 400°F. Cover the potatoes with salted water, boil 15 minutes until fork-tender, drain, and mash with the butter, milk, salt and pepper.","Meanwhile, cook the ground beef, onion and carrots in a large skillet over medium-high heat for 8–10 minutes, breaking up the meat, until no pink remains and it reaches 160°F. Spoon off excess fat.","Stir in the tomato paste and flour and cook 1 minute, then add the broth and simmer 5 minutes until thickened. Stir in the peas and season.","Spread the beef mixture in a 2-quart baking dish and spoon the mashed potatoes over the top, roughing it up with a fork.","Bake 20–25 minutes until bubbling and the top is golden. Rest 5 minutes before serving."]},{"id":"creamy-garlic-chicken-pasta","name":"Creamy garlic chicken pasta","meal":["dinner"],"cuisine":"Italian","minutes":30,"serves":4,"veg":false,"ingredients":[{"item":"chicken breast","qty":1,"unit":"lb","note":"cut into bite-size pieces"},{"item":"pasta","qty":12,"unit":"oz","note":"penne or fettuccine"},{"item":"garlic","qty":4,"unit":"clove","note":"minced"},{"item":"heavy cream","qty":1,"unit":"cup"},{"item":"parmesan","qty":0.75,"unit":"cup","note":"grated"},{"item":"butter","qty":1,"unit":"tbsp"},{"item":"olive oil","qty":1,"unit":"tbsp"},{"item":"spinach","qty":2,"unit":"handful","optional":true},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Cook the pasta in salted boiling water according to the package; save 1/2 cup pasta water, then drain.","Season the chicken with salt and pepper. Heat the olive oil in a large pan over medium-high heat and cook the chicken 6–8 minutes, stirring, until golden and cooked through to 165°F; move to a plate.","Lower the heat to medium, melt the butter, and cook the garlic 1 minute. Pour in the cream and simmer gently 3 minutes.","Stir in the parmesan until melted, then add the spinach (if using) until wilted.","Return the chicken, add the pasta, and toss, loosening with pasta water as needed. Season to taste and serve."]},{"id":"creamy-potato-soup","name":"Creamy potato soup","meal":["lunch","dinner"],"cuisine":"American comfort","minutes":40,"serves":4,"veg":true,"ingredients":[{"item":"butter","qty":3,"unit":"tbsp"},{"item":"onion","qty":1,"unit":"","note":"diced"},{"item":"garlic","qty":2,"unit":"clove","note":"minced"},{"item":"flour","qty":3,"unit":"tbsp"},{"item":"chicken broth","qty":4,"unit":"cup","note":"use vegetable broth to keep it vegetarian"},{"item":"potatoes","qty":2,"unit":"lb","note":"peeled, cut in 1/2-inch cubes"},{"item":"milk","qty":1,"unit":"cup"},{"item":"cheese","qty":1,"unit":"cup","note":"shredded","optional":true},{"item":"green onions","qty":2,"unit":"","note":"sliced","optional":true},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Melt the butter in a large pot over medium heat and cook the onion 5 minutes until soft; add the garlic for 30 seconds.","Sprinkle in the flour and stir 1 minute, then slowly whisk in the broth.","Add the potatoes, bring to a boil, then simmer 15–20 minutes until very tender.","Mash some of the potatoes right in the pot (or blend half) to thicken, then stir in the milk and heat through without boiling.","Season with salt and pepper and top with cheese and green onions if you like."]},{"id":"crispy-baked-fish","name":"Crispy baked fish","meal":["dinner"],"cuisine":"Classic","minutes":30,"serves":4,"veg":false,"ingredients":[{"item":"white fish","qty":1.5,"unit":"lb","note":"4 cod or tilapia fillets, patted dry"},{"item":"flour","qty":0.25,"unit":"cup"},{"item":"eggs","qty":1,"unit":""},{"item":"breadcrumbs","qty":1,"unit":"cup","note":"panko is crispiest"},{"item":"paprika","qty":1,"unit":"tsp"},{"item":"garlic powder","qty":0.5,"unit":"tsp"},{"item":"olive oil","qty":2,"unit":"tbsp"},{"item":"lemon","qty":1,"unit":"","note":"cut in wedges"},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Heat the oven to 425°F and line a sheet pan with lightly oiled foil.","Set out three shallow dishes: the flour seasoned with salt and pepper; the egg beaten with 1 tbsp water; and the breadcrumbs mixed with the paprika, garlic powder and oil.","Coat each fish fillet in flour, dip in egg, then press into the crumbs on both sides. Lay on the pan.","Bake 12–15 minutes until the crust is golden and the fish is opaque and flakes easily with a fork (145°F). Serve with lemon wedges."]},{"id":"cucumber-raita","name":"Cucumber raita","meal":["lunch","dinner","snack"],"cuisine":"Indian-style","minutes":10,"serves":4,"veg":true,"ingredients":[{"item":"yogurt","qty":1,"unit":"cup","note":"plain"},{"item":"cucumber","qty":0.5,"unit":"","note":"grated"},{"item":"cumin","qty":0.5,"unit":"tsp"},{"item":"fresh herbs","qty":null,"unit":"","note":"chopped cilantro or mint","optional":true},{"item":"salt","qty":null,"unit":""}],"steps":["Squeeze the grated cucumber in your hands or a towel to remove extra water.","Stir the cucumber into the yogurt with the cumin and a pinch of salt.","Add the chopped herbs if using, and chill until ready to serve alongside curry or rice."]},{"id":"deviled-eggs","name":"Deviled eggs","meal":["snack"],"cuisine":"Classic","minutes":30,"serves":6,"veg":true,"ingredients":[{"item":"eggs","qty":6,"unit":""},{"item":"mayo","qty":0.25,"unit":"cup"},{"item":"mustard","qty":1,"unit":"tsp"},{"item":"vinegar","qty":0.5,"unit":"tsp","optional":true},{"item":"paprika","qty":1,"unit":"pinch","note":"for sprinkling"},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Put the eggs in a pot, cover with cold water by an inch and bring to a boil over high heat. Turn off the heat, cover, and let sit 11 minutes until the yolks are fully set and firm.","Move the eggs to ice water for 5 minutes, then peel and halve lengthwise.","Pop the yolks into a bowl and mash with the mayo, mustard, vinegar if using, salt and pepper until smooth.","Spoon or pipe the filling back into the whites and sprinkle with paprika. Keep chilled until serving."]},{"id":"egg-curry","name":"Egg curry","meal":["lunch","dinner"],"cuisine":"Indian-style","minutes":35,"serves":3,"veg":true,"ingredients":[{"item":"eggs","qty":6,"unit":""},{"item":"onion","qty":1,"unit":"","note":"finely diced"},{"item":"garlic","qty":2,"unit":"clove","note":"minced"},{"item":"ginger","qty":1,"unit":"tsp","note":"grated"},{"item":"curry powder","qty":1,"unit":"tbsp"},{"item":"canned tomatoes","qty":1,"unit":"can","note":"14.5 oz, crushed or diced"},{"item":"coconut milk","qty":0.5,"unit":"cup","optional":true},{"item":"vegetable oil","qty":2,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""}],"steps":["Place the eggs in a pot, cover with water, and bring to a boil. Cover, turn off the heat, and let sit 10 minutes until the yolks are firm. Cool in cold water and peel.","Heat the oil in a pan over medium heat and cook the onion 6–8 minutes until golden.","Add the garlic, ginger, and curry powder and stir 1 minute, then add the tomatoes and simmer 8 minutes until thick.","Stir in the coconut milk (or 1/2 cup water) and salt to taste. Cut shallow slits in the eggs, add them to the sauce, and simmer 5 minutes, spooning sauce over.","Serve with rice or naan."]},{"id":"egg-fried-rice","name":"Egg fried rice","meal":["lunch","dinner"],"cuisine":"Chinese","minutes":15,"serves":2,"veg":true,"ingredients":[{"item":"rice","qty":3,"unit":"cup","note":"cooked, ideally a day old"},{"item":"eggs","qty":3,"unit":""},{"item":"green onions","qty":3,"unit":"","note":"sliced"},{"item":"frozen peas","qty":0.5,"unit":"cup"},{"item":"soy sauce","qty":2,"unit":"tbsp"},{"item":"sesame oil","qty":1,"unit":"tsp"},{"item":"vegetable oil","qty":2,"unit":"tbsp"}],"steps":["Beat the eggs in a bowl with a pinch of salt.","Heat 1 tbsp oil in a large pan over medium-high heat, pour in the eggs, and scramble about 1 minute until just set; move them to a plate.","Add the remaining oil, the white parts of the green onions, and the peas; cook 1–2 minutes.","Add the rice, breaking up clumps, and fry 3–4 minutes until hot and starting to crisp in spots.","Stir in the soy sauce, sesame oil, the eggs, and the green onion tops, toss for 30 seconds, and serve."]},{"id":"egg-in-a-hole","name":"Egg in a hole","meal":["breakfast"],"cuisine":"American comfort","minutes":10,"serves":1,"veg":true,"ingredients":[{"item":"bread","qty":1,"unit":"slice"},{"item":"eggs","qty":1,"unit":""},{"item":"butter","qty":1,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Cut a round hole about 2 inches wide in the center of the bread using a glass or cookie cutter.","Melt the butter in a nonstick pan over medium heat and add the bread and the cut-out circle.","Crack the egg into the hole, season with salt and pepper, and cook 2–3 minutes until the bottom is golden and the white starts to set.","Flip carefully and cook 1–2 minutes more until the white is fully set (longer for a firm yolk). Serve with the toasted circle."]},{"id":"egg-muffin-cups","name":"Egg muffin cups","meal":["breakfast","snack"],"cuisine":"Classic","minutes":30,"serves":4,"veg":true,"ingredients":[{"item":"eggs","qty":8,"unit":""},{"item":"milk","qty":0.25,"unit":"cup"},{"item":"cheese","qty":0.5,"unit":"cup","note":"shredded"},{"item":"bell pepper","qty":1,"unit":"","note":"finely diced"},{"item":"spinach","qty":1,"unit":"handful","note":"chopped"},{"item":"butter","qty":1,"unit":"tbsp","note":"for greasing"},{"item":"salt","qty":null,"unit":""}],"steps":["Heat the oven to 350°F and grease a 12-cup muffin tin with the butter.","Whisk the eggs with the milk and a pinch of salt.","Divide the bell pepper, spinach and cheese among the cups, then pour the egg mixture over, filling each about two-thirds full.","Bake 18–20 minutes until puffed and set in the center. Cool 5 minutes before removing; refrigerate leftovers up to 4 days."]},{"id":"egg-salad-sandwich","name":"Egg salad sandwich","meal":["lunch"],"cuisine":"Classic","minutes":30,"serves":2,"veg":true,"ingredients":[{"item":"eggs","qty":4,"unit":""},{"item":"mayo","qty":3,"unit":"tbsp"},{"item":"mustard","qty":1,"unit":"tsp"},{"item":"bread","qty":4,"unit":"slice"},{"item":"lettuce","qty":2,"unit":"","note":"leaves","optional":true},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Put the eggs in a pot, cover with cold water by an inch and bring to a boil over high heat.","Turn off the heat, cover, and let sit 11 minutes so the yolks are fully set and firm. Move the eggs to ice water for 5 minutes, then peel.","Chop the eggs and mix with the mayo, mustard, salt and pepper.","Spread on two slices of bread, add lettuce if using, and top with the remaining bread."]},{"id":"fish-tacos","name":"Fish tacos","meal":["lunch","dinner"],"cuisine":"Mexican","minutes":25,"serves":3,"veg":false,"ingredients":[{"item":"white fish","qty":1,"unit":"lb","note":"cod or tilapia fillets"},{"item":"chili powder","qty":1,"unit":"tsp"},{"item":"cumin","qty":0.5,"unit":"tsp"},{"item":"cabbage","qty":2,"unit":"cup","note":"thinly shredded"},{"item":"mayo","qty":0.25,"unit":"cup"},{"item":"lime","qty":2,"unit":""},{"item":"tortillas","qty":6,"unit":"","note":"small corn or flour"},{"item":"hot sauce","qty":null,"unit":"","optional":true},{"item":"vegetable oil","qty":1,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""}],"steps":["Stir the mayo with the juice of 1 lime and a few dashes of hot sauce to make a quick sauce.","Pat the fish dry and season both sides with the chili powder, cumin and 1/2 tsp salt.","Heat the oil in a nonstick skillet over medium-high heat and cook the fish 3–4 minutes per side until opaque and it flakes easily with a fork; break into chunks.","Warm the tortillas, then fill with cabbage and fish, drizzle with the sauce and serve with the second lime in wedges."]},{"id":"fluffy-pancakes","name":"Fluffy pancakes","meal":["breakfast"],"cuisine":"American comfort","minutes":25,"serves":3,"veg":true,"ingredients":[{"item":"flour","qty":1,"unit":"cup"},{"item":"sugar","qty":1,"unit":"tbsp"},{"item":"baking powder","qty":2,"unit":"tsp"},{"item":"salt","qty":0.25,"unit":"tsp"},{"item":"milk","qty":1,"unit":"cup"},{"item":"eggs","qty":1,"unit":""},{"item":"butter","qty":2,"unit":"tbsp","note":"melted, plus extra for the pan"},{"item":"maple syrup","qty":null,"unit":"","optional":true,"note":"for serving"}],"steps":["In a bowl, mix the flour, sugar, baking powder and salt.","In another bowl, whisk the milk, egg and melted butter, then pour into the dry ingredients and stir just until combined; a few lumps are fine.","Heat a nonstick pan over medium heat and brush with a little butter.","Pour in about 1/4 cup batter per pancake and cook 2–3 minutes until bubbles form on top and the edges look set.","Flip and cook 1–2 minutes more until golden and cooked through. Serve with maple syrup."]},{"id":"french-toast","name":"French toast","meal":["breakfast"],"cuisine":"Classic","minutes":15,"serves":2,"veg":true,"ingredients":[{"item":"bread","qty":4,"unit":"slice"},{"item":"eggs","qty":2,"unit":""},{"item":"milk","qty":0.5,"unit":"cup"},{"item":"cinnamon","qty":0.5,"unit":"tsp"},{"item":"vanilla","qty":0.5,"unit":"tsp"},{"item":"butter","qty":1,"unit":"tbsp"},{"item":"maple syrup","qty":null,"unit":"","optional":true,"note":"for serving"}],"steps":["In a shallow dish, whisk the eggs, milk, cinnamon and vanilla together.","Melt half the butter in a large nonstick pan over medium heat.","Dip each slice of bread in the egg mixture for a few seconds per side so it soaks in but doesn't fall apart.","Cook 2–3 minutes per side until golden brown and the center is set, adding the rest of the butter for the second batch.","Serve warm with maple syrup if you like."]},{"id":"fried-egg-rice-bowl","name":"Fried egg rice bowl","meal":["breakfast","lunch"],"cuisine":"Korean","minutes":10,"serves":1,"veg":true,"ingredients":[{"item":"rice","qty":1,"unit":"cup","note":"cooked"},{"item":"eggs","qty":2,"unit":""},{"item":"soy sauce","qty":1,"unit":"tbsp"},{"item":"sesame oil","qty":1,"unit":"tsp"},{"item":"green onions","qty":1,"unit":"","note":"sliced"},{"item":"vegetable oil","qty":1,"unit":"tbsp"}],"steps":["Reheat the rice in the microwave, covered, for 1–2 minutes until steaming hot, and put it in a bowl.","Heat the vegetable oil in a nonstick pan over medium-high heat, crack in the eggs and fry 2–3 minutes until the edges are crisp and the whites are fully set.","Slide the eggs onto the rice, drizzle with the soy sauce and sesame oil, and scatter the green onions on top."]},{"id":"garlic-butter-steak","name":"Garlic butter steak","meal":["dinner"],"cuisine":"Classic","minutes":25,"serves":2,"veg":false,"ingredients":[{"item":"steak","qty":2,"unit":"","note":"8–10 oz each, about 1 inch thick (sirloin or ribeye)"},{"item":"vegetable oil","qty":1,"unit":"tbsp"},{"item":"butter","qty":3,"unit":"tbsp"},{"item":"garlic","qty":3,"unit":"clove","note":"smashed"},{"item":"fresh herbs","qty":null,"unit":"","note":"thyme or rosemary sprigs","optional":true},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Take the steaks out of the fridge 20 minutes ahead, pat dry and season well with salt and pepper.","Heat the oil in a heavy skillet over high heat until it just smokes, add the steaks and sear 3–4 minutes without moving until a deep golden crust forms.","Flip, lower the heat to medium, and add the butter, garlic and herbs if using. Tilt the pan and spoon the foaming butter over the steaks for 3–4 minutes.","Cook to 145°F for medium (USDA-recommended), or 130–135°F if you prefer medium-rare. Rest 5 minutes, slice against the grain and pour the garlic butter over."]},{"id":"garlic-soy-chicken","name":"Garlic soy chicken","meal":["dinner"],"cuisine":"Chinese","minutes":25,"serves":2,"veg":false,"ingredients":[{"item":"chicken thighs","qty":1,"unit":"lb","note":"boneless, skinless, cut into bite-size pieces"},{"item":"garlic","qty":4,"unit":"clove","note":"minced"},{"item":"soy sauce","qty":3,"unit":"tbsp"},{"item":"honey","qty":1,"unit":"tbsp"},{"item":"green onions","qty":2,"unit":"","note":"sliced"},{"item":"vegetable oil","qty":1,"unit":"tbsp"},{"item":"rice","qty":2,"unit":"cup","note":"cooked, to serve"}],"steps":["Mix the soy sauce, honey, and 2 tbsp water in a small bowl.","Heat the oil in a large pan over medium-high heat. Add the chicken in one layer and cook 6–8 minutes, turning, until browned and it reaches 165°F inside.","Lower the heat to medium, add the garlic, and stir 30 seconds until fragrant.","Pour in the sauce and simmer 1–2 minutes, stirring, until it coats the chicken.","Top with green onions and serve over rice."]},{"id":"ginger-soy-pork-chops","name":"Ginger soy pork chops","meal":["dinner"],"cuisine":"Japanese","minutes":25,"serves":2,"veg":false,"ingredients":[{"item":"pork chops","qty":2,"unit":"","note":"boneless, about 3/4 inch thick"},{"item":"ginger","qty":1,"unit":"tbsp","note":"grated"},{"item":"garlic","qty":1,"unit":"clove","note":"grated"},{"item":"soy sauce","qty":2,"unit":"tbsp"},{"item":"honey","qty":1,"unit":"tbsp"},{"item":"vegetable oil","qty":1,"unit":"tbsp"},{"item":"rice","qty":2,"unit":"cup","note":"cooked, to serve"}],"steps":["Mix the ginger, garlic, soy sauce, honey, and 2 tbsp water in a small bowl. Pat the pork chops dry.","Heat the oil in a skillet over medium-high heat. Cook the pork 4–5 minutes per side until golden and it reaches 145°F inside.","Lower the heat, pour in the sauce, and simmer 1 minute, turning the chops to glaze them.","Rest the chops 3 minutes, then slice and serve over rice with the pan sauce."]},{"id":"ginger-soy-salmon","name":"Ginger soy salmon","meal":["dinner"],"cuisine":"Japanese","minutes":20,"serves":2,"veg":false,"ingredients":[{"item":"salmon","qty":2,"unit":"piece","note":"fillets, about 6 oz each"},{"item":"soy sauce","qty":2,"unit":"tbsp"},{"item":"honey","qty":1,"unit":"tbsp"},{"item":"ginger","qty":1,"unit":"tsp","note":"grated"},{"item":"garlic","qty":1,"unit":"clove","note":"grated"},{"item":"green onions","qty":1,"unit":"","note":"sliced"},{"item":"vegetable oil","qty":1,"unit":"tbsp"}],"steps":["Mix the soy sauce, honey, ginger, and garlic in a small bowl. Pat the salmon dry.","Heat the oil in a nonstick pan over medium-high heat. Cook the salmon skin-side up 4 minutes until golden, then flip.","Lower the heat to medium and cook 3–4 minutes more until the salmon is opaque and flakes easily with a fork (145°F).","Pour the sauce into the pan and spoon it over the fish for 30–60 seconds until slightly thick. Top with green onions."]},{"id":"greek-lemon-potatoes","name":"Greek lemon potatoes","meal":["dinner"],"cuisine":"Greek","minutes":60,"serves":4,"veg":true,"ingredients":[{"item":"potatoes","qty":2,"unit":"lb","note":"Yukon gold, cut into wedges"},{"item":"lemon","qty":1,"unit":"","note":"juiced"},{"item":"garlic","qty":3,"unit":"clove","note":"minced"},{"item":"chicken broth","qty":0.75,"unit":"cup","note":"use vegetable broth to keep it vegetarian"},{"item":"italian seasoning","qty":2,"unit":"tsp","note":"dried oregano"},{"item":"olive oil","qty":0.25,"unit":"cup"},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Heat the oven to 425°F.","In a 9x13-inch baking dish, toss the potatoes with the olive oil, lemon juice, garlic, oregano, 1 tsp salt, and pepper, then pour the vegetable broth around them.","Roast 25 minutes, flip the potatoes, and roast 20–25 minutes more until the liquid is mostly absorbed and the edges are golden and crisp.","Taste, add a squeeze more lemon or salt if needed, and serve."]},{"id":"greek-salad","name":"Greek salad","meal":["lunch","dinner"],"cuisine":"Greek","minutes":15,"serves":4,"veg":true,"ingredients":[{"item":"tomatoes","qty":3,"unit":"","note":"cut into wedges"},{"item":"cucumber","qty":1,"unit":"","note":"halved and sliced"},{"item":"red onion","qty":0.5,"unit":"","note":"thinly sliced"},{"item":"bell pepper","qty":1,"unit":"","note":"green, sliced"},{"item":"feta","qty":6,"unit":"oz","note":"block or crumbled"},{"item":"olive oil","qty":0.25,"unit":"cup"},{"item":"vinegar","qty":1,"unit":"tbsp","note":"red wine vinegar ideally"},{"item":"italian seasoning","qty":1,"unit":"tsp","note":"dried oregano"},{"item":"salt","qty":null,"unit":""}],"steps":["Put the tomatoes, cucumber, red onion, and bell pepper in a large bowl.","Whisk the olive oil, vinegar, half the oregano, and a pinch of salt, then pour over the vegetables and toss.","Top with the feta, sprinkle with the remaining oregano, and serve."]},{"id":"greek-yogurt-parfait","name":"Greek yogurt parfait","meal":["breakfast","snack"],"cuisine":"Classic","minutes":5,"serves":1,"veg":true,"ingredients":[{"item":"yogurt","qty":1,"unit":"cup","note":"Greek"},{"item":"berries","qty":0.5,"unit":"cup"},{"item":"oats","qty":0.25,"unit":"cup","note":"or granola"},{"item":"honey","qty":1,"unit":"tbsp"}],"steps":["Spoon half the yogurt into a glass or bowl.","Add half the berries and half the oats, then repeat the layers.","Drizzle the honey over the top and eat right away so the oats stay crunchy."]},{"id":"grilled-cheese","name":"Grilled cheese","meal":["lunch","snack"],"cuisine":"American comfort","minutes":10,"serves":1,"veg":true,"ingredients":[{"item":"bread","qty":2,"unit":"slice"},{"item":"cheese","qty":2,"unit":"slice","note":"or 1/2 cup shredded"},{"item":"butter","qty":1,"unit":"tbsp","note":"softened"}],"steps":["Spread the butter on one side of each bread slice.","Place one slice butter-side down in a nonstick pan, top with the cheese, then the second slice butter-side up.","Cook over medium-low heat for 3–4 minutes until the bottom is golden, then flip.","Cook another 2–3 minutes until the second side is golden and the cheese is melted. Cut in half and serve."]},{"id":"guacamole","name":"Guacamole","meal":["snack"],"cuisine":"Mexican","minutes":10,"serves":4,"veg":true,"ingredients":[{"item":"avocado","qty":3,"unit":"","note":"ripe"},{"item":"lime","qty":1,"unit":""},{"item":"red onion","qty":0.25,"unit":"","note":"finely diced"},{"item":"tomatoes","qty":1,"unit":"","note":"seeded and diced","optional":true},{"item":"jalapeno","qty":1,"unit":"","note":"seeded and minced","optional":true},{"item":"fresh herbs","qty":null,"unit":"","note":"cilantro, chopped"},{"item":"salt","qty":null,"unit":""}],"steps":["Halve the avocados, remove the pits and scoop the flesh into a bowl.","Squeeze in the lime juice, add 1/2 tsp salt and mash with a fork until mostly smooth but still a little chunky.","Stir in the red onion, plus the tomatoes, jalapeno and cilantro if using.","Taste and add more salt or lime; serve right away with chips (press plastic wrap on the surface if storing)."]},{"id":"ham-and-cheese-omelette","name":"Ham and cheese omelette","meal":["breakfast","lunch"],"cuisine":"Classic","minutes":10,"serves":1,"veg":false,"ingredients":[{"item":"eggs","qty":3,"unit":""},{"item":"ham","qty":2,"unit":"oz","note":"diced"},{"item":"cheese","qty":0.25,"unit":"cup","note":"shredded"},{"item":"butter","qty":1,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Whisk the eggs with a pinch of salt and pepper.","Melt the butter in a nonstick pan over medium heat and warm the ham for 1–2 minutes.","Spread the ham out, pour in the eggs, and lower the heat to medium-low. Gently push the edges toward the center as they set, tilting so raw egg runs underneath.","When the eggs are set with no runny liquid on top, sprinkle the cheese over one half, fold, and slide onto a plate."]},{"id":"honey-mustard-chicken","name":"Honey mustard chicken","meal":["dinner"],"cuisine":"American comfort","minutes":35,"serves":4,"veg":false,"ingredients":[{"item":"chicken breast","qty":1.5,"unit":"lb","note":"pounded to even thickness"},{"item":"honey","qty":0.25,"unit":"cup"},{"item":"mustard","qty":0.25,"unit":"cup","note":"Dijon or yellow"},{"item":"olive oil","qty":1,"unit":"tbsp"},{"item":"garlic powder","qty":0.5,"unit":"tsp"},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Heat the oven to 400°F and lightly oil a baking dish.","Whisk the honey, mustard, oil and garlic powder together.","Season the chicken with salt and pepper, place in the dish and pour the sauce over, turning to coat.","Bake 20–25 minutes, spooning sauce over halfway, until the chicken reaches 165°F. Rest 5 minutes and serve with the pan sauce."]},{"id":"huevos-rancheros","name":"Huevos rancheros","meal":["breakfast","lunch"],"cuisine":"Mexican","minutes":20,"serves":2,"veg":true,"ingredients":[{"item":"eggs","qty":4,"unit":""},{"item":"tortillas","qty":4,"unit":"","note":"small corn or flour"},{"item":"canned black beans","qty":1,"unit":"can","note":"drained and rinsed"},{"item":"salsa","qty":0.5,"unit":"cup"},{"item":"cheese","qty":0.25,"unit":"cup","note":"shredded"},{"item":"avocado","qty":1,"unit":"","note":"sliced","optional":true},{"item":"vegetable oil","qty":2,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""}],"steps":["Warm the black beans in a small saucepan over medium heat for 3–4 minutes, mashing some with a fork; ,"steps":["Cook the pasta in salted boiling water according to the package; save 1/2 cup pasta water, then drain.","Pat the shrimp dry and season with salt. Heat the olive oil in a large pan over medium-high heat and cook the shrimp 1–2 minutes per side until pink and opaque; move to a plate.","Lower the heat to medium, add the butter, garlic, and red pepper flakes, and cook 1 minute.","Add the lemon zest, lemon juice, pasta, and a splash of pasta water; toss until glossy.","Return the shrimp, toss to warm through, and serve topped with parsley."]},{"id":"lemon-herb-chicken-thighs","name":"Lemon herb chicken thighs","meal":["dinner"],"cuisine":"Mediterranean","minutes":45,"serves":4,"veg":false,"ingredients":[{"item":"chicken thighs","qty":2,"unit":"lb","note":"bone-in, skin-on (about 6)"},{"item":"lemon","qty":1,"unit":"","note":"zested and juiced"},{"item":"garlic","qty":3,"unit":"clove","note":"minced"},{"item":"italian seasoning","qty":2,"unit":"tsp"},{"item":"olive oil","qty":2,"unit":"tbsp"},{"item":"salt","qty":null,"unit":""},{"item":"black pepper","qty":null,"unit":""}],"steps":["Heat the oven to 425°F. Pat the chicken thighs dry.","Mix the olive oil, lemon zest, lemon juice, garlic, italian seasoning, 1 tsp salt, and some pepper; rub all over the chicken.","Place skin-side up in a baking dish or on a sheet pan and roast 35–40 minutes until the skin is golden and crisp and the thickest part reaches 165°F.","Rest 5 minutes, then spoon the pan juices over the top to serve."]},{"id":"lentil-soup","name":"Lentil soup","meal":["lunch","dinner"],"cuisine":"Mediterranean","minutes":45,"serves":6,"veg":true,"ingredients":[{"item":"lentils","qty":1.5,"unit":"cup","note":"dry brown or green, rinsed"},{"item":"onion","qty":1,"unit":"","note":"diced"},{"item":"carrots","qty":2,"unit":"","note":"diced"},{"item":"celery","qty":2,"unit":"piece","note":"stalks, diced"},{"item":"garlic","qty":3,"unit":"clove","note":"minced"},{"item":"canned tomatoes","qty":1,"unit":"can","
