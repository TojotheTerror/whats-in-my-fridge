<script>
// Runs before the first paint. 1) Restore a manual theme so it never flashes.
// 2) Only when launched inside Telegram: capture its launch params from the URL before the
//    app touches location.hash (Telegram's script also reads them from this sessionStorage key),
//    then load telegram-web-app.js. Plain browsers never request telegram.org.
(function () {
  var d = document.documentElement, s = {}, P = {}, tg = false, scheme = "";
  try { s = JSON.parse(localStorage.getItem("fridge.v3")) || {}; } catch (e) {}
  [location.hash, location.search].forEach(function (q) {
    q.slice(1).split("&").forEach(function (kv) {
      var i = kv.indexOf("="); if (i < 1) return;
      try { var k = decodeURIComponent(kv.slice(0, i)); if (/^tgWebApp/.test(k) && !(k in P)) P[k] = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, "%20")); } catch (e) {}
    });
  });
  var has = function (o) { return !!o && (o.tgWebAppData != null || o.tgWebAppPlatform != null || o.tgWebAppVersion != null); };
  tg = has(P);
  try {
    var old = JSON.parse(sessionStorage.getItem("__telegram__initParams")) || {};
    if (tg) { for (var k in old) if (!(k in P)) P[k] = old[k]; sessionStorage.setItem("__telegram__initParams", JSON.stringify(P)); }
    else if (has(old)) { P = old; tg = true; }
  } catch (e) {}
  if (tg) {
    window.__tgLaunch = P;
    try { // same rule Telegram uses for colorScheme: brightness of bg_color
      var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(JSON.parse(P.tgWebAppThemeParams || "{}").bg_color || "");
      if (m) { var r = parseInt(m[1], 16), g = parseInt(m[2], 16), b = parseInt(m[3], 16); scheme = Math.sqrt(0.299 * r * r + 0.587 * g * g + 0.114 * b * b) < 120 ? "dark" : "light"; }
    } catch (e) {}
    window.__tgScheme = scheme;
    var sc = document.createElement("script"); sc.src = "https://telegram.org/js/telegram-web-app.js"; sc.async = true;
    sc.onload = function () { window.__tgLoaded = true; if (window.__tgInit) window.__tgInit(); };
    document.head.appendChild(sc);
  }
  var th = s.theme === "dark" || s.theme === "light" ? s.theme : scheme;
  if (th) d.setAttribute("data-theme", th);
  setTimeout(function () { d.classList.add("ready"); }, 3000); // safety net; the app adds it as soon as it has rendered
})();
</script>
<style>

*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0}

.shop input{accent-color:var(--ok);width:22px;height:22px;flex:none}
.shop .it{flex:1}.shop small{display:block;color:var(--muted);font-weight:400;font-size:12px}

.btns{display:flex;gap:8px}.btns .cta{flex:1}

.shbar{display:flex;justify-content:space-between;align-items:center}

.hero{height:130px;display:grid;place-items:center;font-size:64px;margin:12px 0;border-radius:26px}

.serv button{min-width:44px;height:38px;background:var(--card);border-radius:12px;font-weight:700}

h4{font-size:20px;font-weight:800;margin:20px 0 6px}
.ing{list-style:none}
.ing li{padding:11px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.ing .mk{width:20px;flex:none;color:var(--ok);font-weight:800}
.ing li.no .mk{color:var(--warn)}
.ing li.h .tx{color:var(--muted)}
.ing .opt2{font-size:12px;color:var(--dim)}
.need{background:color-mix(in srgb,var(--warn) 15%,var(--card));border-radius:16px;padding:12px 14px;margin:12px 0;font-size:14px}

.cook.open{display:flex}
.cook .cb{max-width:440px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column}
.cook .prog{display:flex;gap:4px;margin:14px 0}.cook .prog i{flex:1;height:6px;border-radius:3px;background:var(--card2)}.cook .prog i.on{background:var(--accent)}
.cook .shbar{gap:12px}.cook .back{flex:none;white-space:nowrap;padding:0 4px}
.cook .shbar b{flex:1;min-width:0;text-align:right;font-size:14px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cook .stepn{color:var(--accent-text);font-weight:800;font-size:15px}
.cook .stept{font-size:27px;font-weight:700;line-height:1.35;flex:1;margin-top:10px;overflow:auto}
.cook .nav{display:flex;gap:10px}.cook .nav button{flex:1;padding:18px;border-radius:18px;font-size:18px;font-weight:800;background:var(--card)}
.cook .nav button:disabled{opacity:.35}
.cook .nav .nx{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#17151f}
.wake{font-size:12px;color:var(--dim);margin-top:8px;text-align:center}

.toast.show{opacity:1}.toast.act{pointer-events:auto;cursor:pointer}.toast u{margin-left:12px}
.foot{font-size:12px;color:var(--dim);margin:28px 0 0}
main>.foot{display:none}.screen[data-s=fridge].on:has(.rc)~.foot{display:block}
/* keyboard open on a phone: give the screen back to what she's typing */
@media (pointer:coarse){body:has(input:not([type=checkbox]):focus) .tabs{display:none}}

html:not(.ready) main,html:not(.ready) .tabs,html:not(.ready) .tag{visibility:hidden}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
(() => {
const DATA = JSON.parse(document.getElementById("data").textContent);
const VOCAB = DATA.vocab, RECIPES = DATA.recipes, BYID = Object.fromEntries(RECIPES.map(r => [r.id, r]));
const getRecipe = id => BYID[id] || (window.Builder && Builder.fromId(id)) || null;
const ALWAYS = new Set(["salt", "black pepper"]);
const DEFAULT_STAPLES = ["vegetable oil", "olive oil", "sugar", "flour", "butter", "garlic powder", "italian seasoning"];
const MEALS = ["breakfast", "lunch", "dinner", "snack"];
const KEY = "fridge.v3";

// ---- protein categories ----
const CATS = {
  poultry: { label: "Poultry", e: "🍗", items: ["chicken breast", "chicken thighs", "ground turkey"], sub: "chicken, turkey" },
  seafood: { label: "Seafood", e: "🐟", items: ["salmon", "shrimp", "white fish", "canned tuna"], sub: "salmon, shrimp, fish" },
  beef:    { label: "Beef", e: "🥩", items: ["ground beef", "steak"], sub: "steak, ground beef" },
  pork:    { label: "Pork", e: "🥓", items: ["pork chops", "sausage", "bacon", "ham"], sub: "chops, sausage, bacon" },
  veg:     { label: "Vegetarian", e: "🥦", items: ["tofu", "canned black beans", "canned chickpeas", "lentils", "eggs"], sub: "tofu, beans, eggs" },
};
const ITEMCAT = {}; for (const [c, v] of Object.entries(CATS)) if (c !== "veg") for (const i of v.items) ITEMCAT[i] = c;
const NOT_PICKABLE = new Set(["garlic", "ginger", "fresh herbs", "green onions", "red onion", "jalapeno"]);
const VEGGIES = Object.keys(VOCAB).filter(k => VOCAB[k].group === "veg" && !NOT_PICKABLE.has(k)).sort();
const VEMOJI = { asparagus: "🌱", avocado: "🥑", "bell pepper": "🫑", "bok choy": "🥬", broccoli: "🥦", "brussels sprouts": "🥬", "butternut squash": "🎃", cabbage: "🥬", carrots: "🥕", cauliflower: "🥦", celery: "🥬", "cherry tomatoes": "🍅", corn: "🌽", cucumber: "🥒", eggplant: "🍆", "frozen peas": "🫛", "green beans": "🫛", kale: "🥬", leeks: "🧅", lettuce: "🥬", mushrooms: "🍄", onion: "🧅", potatoes: "🥔", "snap peas": "🫛", spinach: "🥬", "sweet potatoes": "🍠", tomatoes: "🍅", zucchini: "🥒" };
function catOf(r) { for (const i of r.ingredients) if (ITEMCAT[i.item]) return ITEMCAT[i.item]; return "veg"; }
const EMO = [[/taco|tostada|nacho/, "🌮"], [/burrito|quesadilla|wrap|fajita/, "🌯"], [/pizza/, "🍕"], [/pasta|spaghetti|penne|ziti|mac|lo mein|noodle|cacio|bolognese|ramen/, "🍝"], [/soup|stew|chili|minestrone/, "🍲"], [/curry|dal|masala|korma|aloo|butter chicken|tandoori/, "🍛"], [/salad|raita/, "🥗"], [/pancake/, "🥞"], [/french toast|toast|sandwich|blt|melt|joe|grilled cheese/, "🥪"], [/smoothie/, "🥤"], [/oat|parfait|yogurt/, "🥣"], [/banana bread|bites/, "🍌"], [/omelette|egg|frittata|scramble|shakshuka|huevos|migas/, "🍳"], [/rice|bowl|risotto|oyakodon/, "🍚"], [/potato|hash/, "🥔"], [/salmon|fish/, "🐟"], [/shrimp/, "🍤"], [/steak|beef/, "🥩"], [/guacamole|hummus|salsa|pico|bruschetta/, "🥑"]];
const CATE = { poultry: "🍗", seafood: "🐟", beef: "🥩", pork: "🥓", veg: "🥦" };

        el("span", { class: "pe", text: F.e }), el("b", { text: F.label }), o.ok ? null : el("small", { text: o.why })));
    }

    const err = Builder.valid(sel);

}
const cap = x => x ? x[0].toUpperCase() + x.slice(1) : x;
function similarTested(r) {

    .map(r => { const s = score(r, have); s.vhit = b.veg.filter(v => r.ingredients.some(i => i.item === v)); return s; })
    .sort((x, y) => y.vhit.length - x.vhit.length || x.miss.length - y.miss.length || x.r.minutes - y.r.minutes);

// ---- RECIPES tab ----
let rshown = 30, rtag = "";
function renderRecipes() {

    f.append(el("button", { class: "f" + (st.rf === k ? " on" : ""), onclick: () => { st.rf = k; rshown = 30; save(); renderRecipes(); } }, k));
  const on = f.querySelector(".on"); // a filter restored from last time must be visible, not scrolled off-screen
  if (on) { const a = f.getBoundingClientRect(), c = on.getBoundingClientRect(); if (c.width && (c.left < a.left || c.right > a.right)) f.scrollLeft += c.left - a.left - (a.width - c.width) / 2; }

    if (k === "All") return true; if (k === "♥ Saved") return isFav(r.id); if (k === "Quick") return r.minutes <= 20; if (k === "Veggie") return r.veg;
    if (MEALS.includes(k.toLowerCase())) return r.meal.includes(k.toLowerCase());

  });
  if (k === "♥ Saved") list = [...list, ...st.favs.filter(id => !BYID[id]).map(getRecipe).filter(Boolean).filter(r => !q || r.name.toLowerCase().includes(q))];
  rtag = k === "All" && !q ? `${RECIPES.length} recipes` : `${list.length} of ${RECIPES.length} recipes`;

      : el("p", { class: "empty", style: "grid-column:span 2", text: k === "♥ Saved" ? "Nothing saved yet. Tap ♡ on any recipe." : "No recipes match." }));

  if (list.length > rshown) out.append(el("button", { class: "cta ghost", style: "grid-column:span 2", onclick: () => { rshown += 30; renderRecipes(); } }, `Show more (${list.length - rshown})`));
}
$("q").addEventListener("input", () => { rshown = 30; renderRecipes(); });

// ---- LIST tab ----
function addToList(items, from) {
  let n = 0;
  for (const it of items) { const ex = st.list.find(x => x.item === it.item); if (ex) { if (!ex.from.includes(from)) ex.from.push(from); } else { st.list.push({ item: it.item, amt: it.amt || "", from: [from], done: false }); n++; } }
  save(); renderAll(); toast(n ? `Added ${n} to your list` : "Already on your list"); haptic();
}
function renderList() {

    cb.addEventListener("change", () => { x.done = cb.checked; save(); lab.classList.toggle("done", x.done); cnt.textContent = st.list.filter(y => !y.done).length; renderTabs(); });
    box.append(lab); lab.append(cb, el("span", { class: "it" }, x.item + (x.amt ? ` — ${x.amt}` : ""), el("small", { text: x.from.map(f => f === "you" ? "added by you" : "for " + f).join(" · ") })));
  }
  out.append(box, el("div", { class: "btns" },
    el("button", { class: "cta ghost", onclick: () => copy("Shopping list:\n" + st.list.filter(x => !x.done).map(x => "- " + pretty(x.item) + (x.amt ? ` (${x.amt})` : "")).join("\n")) }, "Copy list"),
    el("button", { class: "cta ghost", onclick: () => { const n = st.list.filter(x => x.done).length; st.list = st.list.filter(x => !x.done); save(); renderAll(); toast(n ? `Cleared ${n}` : "Nothing checked"); } }, "Clear checked")));
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch (e) { const t = el("textarea"); t.value = text; document.body.append(t); t.select(); try { document.execCommand("copy"); toast("Copied"); } catch (_) { toast("Couldn't copy"); } t.remove(); }
}

// ---- amounts ----
const FR = [[0.125, "⅛"], [0.25, "¼"], [1 / 3, "⅓"], [0.5, "½"], [2 / 3, "⅔"], [0.75, "¾"]];
function fmtQty(q) {
  if (q >= 10) return String(Math.round(q));
  const whole = Math.floor(q), rest = q - whole; let best = null, bd = 0.06;
  for (const [v, s] of FR) { const d = Math.abs(rest - v); if (d < bd) { bd = d; best = s; } }
  if (rest < 0.06) return String(whole || "a little"); if (rest > 0.94) return String(whole + 1);
  if (best) return (whole ? whole + " " : "") + best; return String(Math.round(q * 10) / 10);
}
const PLURAL = { cup: "cups", clove: "cloves", can: "cans", slice: "slices", piece: "pieces", package: "packages", handful: "handfuls", bunch: "bunches", pinch: "pinches" };
function amount(ing, f) { if (ing.qty == null) return ""; const q = ing.qty * f, u = ing.unit || ""; return (fmtQty(q) + " " + (q > 1 && PLURAL[u] ? PLURAL[u] : u)).trim(); }

// ---- recipe sheet ----
let cur = null, servings = null, pushed = false;
function openRecipe(id, push = true) {
  const r = getRecipe(id); if (!r) return;
  cur = r; servings = r.serves;
  if (push) history.pushState({ r: id }, "", "#" + id);
  pushed = push || !!(history.state && history.state.r === id); // false for a shared link opened directly
  drawRecipe(); $("sheet").classList.add("open"); $("sheet").scrollTop = 0; document.body.style.overflow = "hidden"; syncBack();
}
function closeRecipe(pop = true) {
  $("sheet").classList.remove("open"); document.body.style.overflow = ""; cur = null;
  if (pop && hashId()) { if (pushed) history.back(); else history.replaceState(null, "", location.pathname + location.search); } // Back stays in the app
  pushed = false; syncBack();
}
function drawRecipe() {
  const r = cur, have = owned(), f = servings / r.serves, s = score(r, have), sh = $("sh"); sh.replaceChildren();
  sh.append(el("div", { class: "shbar" }, el("button", { class: "back", onclick: () => closeRecipe() }, "← Back"),
    el("button", { class: "heart", "aria-label": "Save", text: isFav(r.id) ? "♥" : "♡", onclick: () => { toggleFav(r.id); drawRecipe(); } })));
  sh.append(el("div", { class: "hero c-" + r._cat, text: r._e }));

  sh.append(el("h2", { text: r.name }),
    el("div", { class: "meta", text: `${r.minutes} min · ${r.cuisine} · ${r.meal.join(", ")}${r.veg ? " · vegetarian" : ""}` }));
  const sv = el("div", { class: "serv" }, "Servings");

  sh.append(sv);
  if (s.miss.length) {
    const items = s.miss.map(i => ({ item: i, amt: amount(r.ingredients.find(x => x.item === i), f) }));
    sh.append(el("div", { class: "need" }, el("div", { text: "🛒 You need: " + items.map(x => x.amt ? `${x.item} (${x.amt})` : x.item).join(", ") }),
      el("button", { class: "cta", onclick: () => addToList(items, r.name) }, "Add to shopping list")));
  }
  sh.append(el("h4", { text: "Ingredients" }));
  const ul = el("ul", { class: "ing" });

    const h = have.has(ing.item), a = amount(ing, f);
    ul.append(el("li", { class: h ? "h" : "no" }, el("span", { class: "mk", text: h ? "✓" : "○" }),
      el("span", { class: "tx" }, (a ? a + " " : "") + ing.item + (ing.note ? `, ${ing.note}` : "") + (ing.qty == null && !ing.optional ? ", to taste" : ""), ing.optional ? el("span", { class: "opt2", text: " (optional)" }) : null)));
  }
  sh.append(ul);
  if (f !== 1) sh.append(el("div", { class: "scaled", text: `Amounts scaled from ${r.serves} to ${servings} servings; cooking times stay about the same.` }));
  sh.append(el("h4", { text: "Steps" }));
  const ol = el("ol", { class: "sp" }); for (const step of r.steps) ol.append(el("li", { text: step })); sh.append(ol);
  sh.append(el("button", { class: "cta", onclick: () => openCook(0) }, "👩‍🍳 Start cook mode"));
  sh.append(el("p", { class: "foot", text: document.querySelector("main > .foot").textContent }));
  if (r.built) {
    sh.append(el("button", { class: "cta ghost", onclick: () => { const sl = r.sel; Object.assign(b, { mode: "build", step: 3, item: sl.protein, cat: Object.keys(CATS).find(k => CATS[k].items.includes(sl.protein)) || b.cat, veg: [...sl.veggies], style: sl.style, flavor: sl.flavor }); st.tab = "build"; save(); closeRecipe(); renderAll(); } }, "↺ Change my picks"));
    const sim = similarTested(r);

}

// ---- cook mode ----
let cookIdx = 0, wake = null;
async function keepAwake() { try { if ("wakeLock" in navigator) { wake = await navigator.wakeLock.request("screen"); } } catch (e) { wake = null; } drawCook(); }
function openCook(i) { cookIdx = i; $("cook").classList.add("open"); keepAwake(); drawCook(); syncBack(); }
function closeCook() { $("cook").classList.remove("open"); try { wake && wake.release(); } catch (e) {} wake = null; syncBack(); }
function drawCook() {
  if (!cur || !$("cook").classList.contains("open")) return;
  const r = cur, n = r.steps.length, cb = $("cb"); cb.replaceChildren();
  cb.append(el("div", { class: "shbar" }, el("button", { class: "back", onclick: closeCook }, "✕ Exit"), el("b", { text: r.name })),
    el("div", { class: "prog" }, r.steps.map((_, i) => el("i", { class: i <= cookIdx ? "on" : "" }))),

      el("button", { disabled: cookIdx === 0 ? "" : null, onclick: () => { if (cookIdx > 0) { cookIdx--; drawCook(); } } }, "← Back"),
      el("button", { class: "nx", onclick: () => { if (cookIdx < n - 1) { cookIdx++; drawCook(); haptic(); } else { closeCook(); toast("Enjoy! 🍽️"); } } }, cookIdx < n - 1 ? "Next →" : "Done ✓")),
    el("div", { class: "wake", text: wake ? "Screen will stay on while cooking" : "Tip: your screen may dim while cooking" }));
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && $("cook").classList.contains("open") && !wake) keepAwake(); });

window.addEventListener("popstate", () => { const id = hashId(); if (id && getRecipe(id)) openRecipe(id, false); else { if ($("cook").classList.contains("open")) closeCook(); if (cur) closeRecipe(false); } });

// ---- tabs ----

document.documentElement.classList.add("ready");
window.__tgInit = initTg; if (window.__tgLoaded) initTg();
