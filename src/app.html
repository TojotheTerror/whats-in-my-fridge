<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2f7d4f">
<title>What's in my fridge?</title>
<style>
  :root{--fg:#1f2328;--muted:#6b7280;--accent:#2f7d4f;--accent-soft:#dff1e5;--border:#d6dbe0;--card:#fff;--bg:#f6f8f7;--warn:#9a5b00}
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:16px;line-height:1.4}
  .wrap{max-width:680px;margin:0 auto}
  h1{font-size:22px;margin:0 0 2px}
  .sub{color:var(--muted);margin:0 0 12px;font-size:14px}
  .row{display:flex;gap:8px}
  input[type=text]{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;font-size:16px}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--fg);padding:8px 12px}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .chip{padding:5px 10px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:14px}
  .chip.unknown{border-style:dashed;color:var(--muted)}
  .chip b{margin-left:6px;color:var(--muted);font-weight:400}
  .links{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;margin-bottom:8px}
  .links button{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;font-size:13px}
  .filters{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
  .tog{padding:6px 12px;border-radius:999px;font-size:14px}
  .tog[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
  .count{font-size:13px;color:var(--muted);margin:8px 0}
  .card{display:block;width:100%;text-align:left;border:1px solid var(--border);border-radius:12px;padding:12px;margin:8px 0;background:var(--card)}
  .card h3{margin:0 0 4px;font-size:16px}
  .meta{font-size:12px;color:var(--muted)}
  .bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden;margin:6px 0}
  .bar i{display:block;height:100%;background:var(--accent)}
  .miss{font-size:13px;color:var(--warn)}
  .ok{font-size:13px;color:var(--accent);font-weight:600}
  .empty{color:var(--muted);font-size:14px;padding:12px 0}
  details.staples{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:8px 12px;margin:8px 0}
  details.staples summary{cursor:pointer;font-size:14px}
  .stgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .stgrid label{font-size:13px;border:1px solid var(--border);border-radius:999px;padding:4px 10px;cursor:pointer}
  .stgrid input{margin-right:4px}
  /* recipe sheet */
  .sheet{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:16px;display:none}
  .sheet.open{display:block}
  .sheet h2{margin:8px 0 2px;font-size:22px}
  .ing{list-style:none;padding:0;margin:8px 0}
  .ing li{padding:6px 0;border-bottom:1px solid var(--border);display:flex;gap:8px}
  .ing .mark{width:20px;flex:none}
  .ing .have{color:var(--muted)}
  .ing .opt{font-size:12px;color:var(--muted)}
  ol.steps{padding-left:22px}
  ol.steps li{margin:0 0 10px}
  .serv{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;margin:10px 0}
  .serv button{padding:6px 12px;border-radius:999px}
  .serv button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .shop{border:1px solid var(--warn);border-radius:12px;padding:10px 12px;margin:10px 0;background:#fff8ec;font-size:14px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:#fff;padding:8px 14px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  h4{margin:16px 0 4px}
  .foot{font-size:12px;color:var(--muted);margin:24px 0 8px}
</style></head><body>
<div class="wrap" id="main">
  <h1>🧊 What can I make?</h1>
  <p class="sub">Type what's in your fridge, then tap a meal for the full recipe.</p>
  <div class="row"><input type="text" id="in" placeholder="e.g. eggs, chicken, rice" autocomplete="off" enterkeyhint="done"><button class="primary" id="add">Add</button></div>
  <div class="chips" id="chips"></div>
  <div class="links"><button id="clear">Clear fridge</button><span>Tap an item to remove it.</span></div>
  <details class="staples" id="staplesBox"><summary>🧂 Things I usually have (<span id="stCount">0</span>)</summary><div class="stgrid" id="stgrid"></div></details>
  <div class="filters" id="filters"></div>
  <div class="count" id="count"></div>
  <div id="out"></div>
  <p class="foot">Recipes are a home-cooking guide. Check meat with a thermometer where a temperature is given. Your list is saved only on this device.</p>
</div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="wrap" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<script id="data" type="application/json">/*DATA*/</script>
<script>
(() => {
const DATA = JSON.parse(document.getElementById("data").textContent);
const VOCAB = DATA.vocab, RECIPES = DATA.recipes;
const ALWAYS = new Set(["salt", "black pepper"]);
const DEFAULT_STAPLES = ["vegetable oil", "olive oil", "sugar", "flour", "butter", "garlic powder", "italian seasoning"];
const STAPLE_GROUPS = new Set(["staple", "spice"]);
const MEALS = ["breakfast", "lunch", "dinner", "snack"];
const KEY = "fridge.v2";
const PROTEIN = new Set(["meat", "fish", "protein"]);

// alias -> canonical key
const ALIAS = {};
for (const [k, v] of Object.entries(VOCAB)) {
  ALIAS[k] = k;
  for (const a of v.aliases) ALIAS[a.toLowerCase()] = k;
}
function canon(word) {
  const w = word.trim().toLowerCase().replace(/\s+/g, " ");
  if (!w) return null;
  if (ALIAS[w]) return ALIAS[w];
  if (w.endsWith("es") && ALIAS[w.slice(0, -2)]) return ALIAS[w.slice(0, -2)];
  if (w.endsWith("s") && ALIAS[w.slice(0, -1)]) return ALIAS[w.slice(0, -1)];
  if (ALIAS[w + "s"]) return ALIAS[w + "s"];
  return w; // unknown: kept, shown dashed
}

// ---- state (on-device only) ----
let st = { fridge: [], staples: DEFAULT_STAPLES.slice(), quick: false, veg: false, meal: "" };
try { Object.assign(st, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };

const $ = id => document.getElementById(id);
const el = (tag, props = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "text") n.textContent = v; else n.setAttribute(k, v);
  }
  for (const c of kids) if (c != null) n.append(c);
  return n;
};
const toast = msg => { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1600); };

// ---- matching ----
function owned() { return new Set([...st.fridge, ...st.staples, ...ALWAYS]); }
function score(r, have) {
  const need = r.ingredients.filter(i => !i.optional).map(i => i.item);
  const got = need.filter(i => have.has(i));
  const miss = need.filter(i => !have.has(i));
  const fromFridge = need.filter(i => st.fridge.includes(i)).length;
  // spices are a minor gap: listed as missing, but don't hide a dish
  const core = miss.filter(i => VOCAB[i].group !== "spice");
  return { r, need, got, miss, core, fromFridge, frac: got.length / need.length };
}
function results() {
  const have = owned();
  return RECIPES
    .filter(r => (!st.quick || r.minutes <= 20) && (!st.veg || r.veg) && (!st.meal || r.meal.includes(st.meal)))
    .map(r => score(r, have))
    // a missing main protein is never a "small" gap (pasta + garlic shouldn't suggest steak)
    .filter(s => s.fromFridge > 0 && s.core.length <= 2 && !s.miss.some(i => PROTEIN.has(VOCAB[i].group)))
    .sort((a, b) => (a.core.length > 0) - (b.core.length > 0) || b.fromFridge - a.fromFridge || a.core.length - b.core.length || a.miss.length - b.miss.length || b.fromFridge - a.fromFridge || b.frac - a.frac || a.r.minutes - b.r.minutes);
}

// ---- render: main ----
let shown = 20;
function render() {
  const chips = $("chips"); chips.replaceChildren();
  for (const x of st.fridge) {
    const known = !!VOCAB[x];
    chips.append(el("button", { class: "chip" + (known ? "" : " unknown"), title: known ? "Remove" : "Not recognised. Tap to remove", onclick: () => { st.fridge = st.fridge.filter(y => y !== x); save(); render(); } }, x, el("b", { text: "×" })));
  }
  $("stCount").textContent = st.staples.length;
  const f = $("filters"); f.replaceChildren();
  const tog = (label, on, fn) => el("button", { class: "tog", "aria-pressed": String(on), onclick: fn }, label);
  f.append(tog("⚡ Quick (≤20 min)", st.quick, () => { st.quick = !st.quick; save(); render(); }));
  f.append(tog("🥦 Vegetarian", st.veg, () => { st.veg = !st.veg; save(); render(); }));
  for (const m of MEALS) f.append(tog(m[0].toUpperCase() + m.slice(1), st.meal === m, () => { st.meal = st.meal === m ? "" : m; save(); render(); }));

  const out = $("out"); out.replaceChildren();
  if (!st.fridge.length) { $("count").textContent = ""; out.append(el("p", { class: "empty", text: `Add a few things you have. There are ${RECIPES.length} recipes to match against.` })); return; }
  const res = results();
  const ready = res.filter(s => !s.miss.length).length;
  $("count").textContent = res.length ? `${ready} you can make now · ${res.length - ready} need 1–2 things` : "";
  if (!res.length) { out.append(el("p", { class: "empty", text: "Nothing matches yet. Try adding a basic like eggs, rice, pasta or bread, or turn off a filter." })); return; }
  for (const s of res.slice(0, shown)) {
    const r = s.r;
    out.append(el("button", { class: "card", "data-id": r.id, onclick: () => openRecipe(r.id) },
      el("h3", { text: (s.miss.length ? "" : "✅ ") + r.name }),
      el("div", { class: "meta", text: `${r.minutes} min · serves ${r.serves} · ${r.cuisine}${r.veg ? " · vegetarian" : ""}` }),
      el("div", { class: "bar" }, el("i", { style: `width:${Math.round(s.frac * 100)}%` })),
      s.miss.length ? el("div", { class: "miss", text: "Missing: " + s.miss.join(", ") }) : el("div", { class: "ok", text: "You have everything" })));
  }
  if (res.length > shown) out.append(el("button", { class: "card", style: "text-align:center", onclick: () => { shown += 20; render(); } }, `Show more (${res.length - shown})`));
}

function renderStaples() {
  const g = $("stgrid"); g.replaceChildren();
  const keys = Object.keys(VOCAB).filter(k => STAPLE_GROUPS.has(VOCAB[k].group) && !ALWAYS.has(k)).sort();
  for (const k of keys) {
    const cb = el("input", { type: "checkbox" }); cb.checked = st.staples.includes(k);
    cb.addEventListener("change", () => { st.staples = cb.checked ? [...new Set([...st.staples, k])] : st.staples.filter(x => x !== k); save(); render(); });
    g.append(el("label", {}, cb, k));
  }
}

// ---- amounts ----
const FR = [[0.125, "⅛"], [0.25, "¼"], [1 / 3, "⅓"], [0.5, "½"], [2 / 3, "⅔"], [0.75, "¾"]];
function fmtQty(q) {
  if (q >= 10) return String(Math.round(q));
  const whole = Math.floor(q), rest = q - whole;
  let best = null, bd = 0.06;
  for (const [v, s] of FR) { const d = Math.abs(rest - v); if (d < bd) { bd = d; best = s; } }
  if (rest < 0.06) return String(whole || (q > 0 ? "a little" : 0));
  if (rest > 0.94) return String(whole + 1);
  if (best) return (whole ? whole + " " : "") + best;
  return String(Math.round(q * 10) / 10);
}
const PLURAL = { cup: "cups", clove: "cloves", can: "cans", slice: "slices", piece: "pieces", package: "packages", handful: "handfuls", bunch: "bunches", pinch: "pinches" };
function amount(ing, factor) {
  if (ing.qty == null) return "";
  const q = ing.qty * factor, u = ing.unit || "";
  return (fmtQty(q) + " " + (q > 1 && PLURAL[u] ? PLURAL[u] : u)).trim();
}

// ---- recipe sheet ----
let current = null, servings = null;
function openRecipe(id, push = true) {
  const r = RECIPES.find(x => x.id === id); if (!r) return;
  current = r; servings = r.serves;
  if (push) history.pushState({ r: id }, "", "#" + id);
  drawRecipe(); $("sheet").classList.add("open"); $("sheet").scrollTop = 0; document.body.style.overflow = "hidden";
}
function closeRecipe(pop = true) {
  $("sheet").classList.remove("open"); document.body.style.overflow = ""; current = null;
  if (pop && location.hash) history.back();
}
function drawRecipe() {
  const r = current, have = owned(), factor = servings / r.serves, s = score(r, have);
  const b = $("sheetBody"); b.replaceChildren();
  b.append(el("button", { onclick: () => closeRecipe() }, "← Back"));
  b.append(el("h2", { text: r.name }));
  b.append(el("div", { class: "meta", text: `${r.minutes} min total · ${r.cuisine} · ${r.meal.join(", ")}${r.veg ? " · vegetarian" : ""}` }));
  const sv = el("div", { class: "serv" }, "Servings:");
  for (const n of [...new Set([1, 2, 4, 6, r.serves])].sort((a, c) => a - c))
    sv.append(el("button", { "aria-pressed": String(n === servings), onclick: () => { servings = n; drawRecipe(); } }, String(n)));
  b.append(sv);
  if (s.miss.length) {
    const list = s.miss.map(i => { const ing = r.ingredients.find(x => x.item === i); const a = amount(ing, factor); return a ? `${i} (${a})` : i; });
    b.append(el("div", { class: "shop" }, el("div", { text: "🛒 You need: " + list.join(", ") }),
      el("button", { style: "margin-top:8px", onclick: () => copy(`Shopping list for ${r.name}:\n` + list.map(x => "- " + x).join("\n")) }, "Copy shopping list")));
  }
  b.append(el("h4", { text: "Ingredients" }));
  const ul = el("ul", { class: "ing" });
  for (const ing of r.ingredients) {
    const h = have.has(ing.item), a = amount(ing, factor);
    ul.append(el("li", {}, el("span", { class: "mark", text: h ? "✓" : "○" }),
      el("span", { class: h ? "have" : "" }, (a ? a + " " : "") + ing.item + (ing.note ? `, ${ing.note}` : "") + (ing.qty == null && !ing.optional ? ", to taste" : ""),
        ing.optional ? el("span", { class: "opt", text: " (optional)" }) : null)));
  }
  b.append(ul);
  if (factor !== 1) b.append(el("div", { class: "meta", text: `Amounts scaled from ${r.serves} to ${servings} servings; cooking times stay about the same.` }));
  b.append(el("h4", { text: "Steps" }));
  const ol = el("ol", { class: "steps" }); for (const step of r.steps) ol.append(el("li", { text: step })); b.append(ol);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch (e) { const t = el("textarea"); t.value = text; document.body.append(t); t.select(); try { document.execCommand("copy"); toast("Copied"); } catch (_) { toast("Couldn't copy"); } t.remove(); }
}
window.addEventListener("popstate", () => { const id = location.hash.slice(1); if (id && RECIPES.some(r => r.id === id)) openRecipe(id, false); else if (current) closeRecipe(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && current) closeRecipe(); });

// ---- input ----
function add(text) {
  for (const part of text.split(/[,\n;]+/)) { const k = canon(part); if (k && !st.fridge.includes(k)) st.fridge.push(k); }
  shown = 20; save(); render();
}
const inp = $("in");
inp.addEventListener("keydown", e => { if (e.key === "Enter") { add(inp.value); inp.value = ""; } });
$("add").onclick = () => { add(inp.value); inp.value = ""; inp.focus(); };
$("clear").onclick = () => { st.fridge = []; save(); render(); };

renderStaples(); render();
const startId = location.hash.slice(1); if (startId && RECIPES.some(r => r.id === startId)) openRecipe(startId, false);

// test hook (read-only helpers + reset), used by automated browser checks
window.__fridge = { add, results: () => results().map(s => ({ id: s.r.id, miss: s.miss, core: s.core })), state: () => JSON.parse(JSON.stringify(st)),
  reset: () => { try { localStorage.removeItem(KEY); } catch (e) {} st = { fridge: [], staples: DEFAULT_STAPLES.slice(), quick: false, veg: false, meal: "" }; renderStaples(); render(); },
  count: RECIPES.length, canon };
})();
</script></body></html>
